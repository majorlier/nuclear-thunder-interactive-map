<!DOCTYPE html>
<html lang="en">
<head>
    <title>Nuclear Thunder Interactive Map</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: #0f111a; color: #f7fafc; }
        #map { width: 100vw; height: 100vh; background: #0a0a0a; }

        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            width: min(330px, calc(100vw - 70px));
            padding: 14px 16px;
            border: 1px solid #3b4252;
            border-radius: 8px;
            background: rgba(15, 17, 26, 0.94);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
            font-size: 13px;
            line-height: 1.45;
            backdrop-filter: blur(5px);
            transition: transform 180ms ease;
        }

        .info-panel.is-collapsed {
            transform: translateX(calc(-100% - 8px));
        }

        .drawer-toggle {
            position: absolute;
            top: 10px;
            right: -34px;
            width: 30px;
            height: 34px;
            padding: 0;
            border: 1px solid #4a5568;
            border-radius: 0 6px 6px 0;
            color: #e2e8f0;
            background: rgba(15, 17, 26, 0.96);
            cursor: pointer;
            font: 18px/1 sans-serif;
        }

        .composition-window {
            position: absolute;
            bottom: 12px;
            right: 10px;
            z-index: 1000;
            width: min(330px, calc(100vw - 70px));
            padding: 10px 12px;
            border: 1px solid #3b4252;
            border-radius: 8px;
            background: rgba(15, 17, 26, 0.94);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
            transition: transform 180ms ease;
            backdrop-filter: blur(5px);
        }

        .composition-window.is-collapsed {
            transform: translateX(calc(100% + 8px));
        }

        .composition-window .drawer-toggle {
            right: auto;
            left: -34px;
            border-radius: 6px 0 0 6px;
        }

        .composition-panel {
            width: 100%;
            max-height: 52vh;
            overflow-y: auto;
            padding: 8px 2px 2px;
            font-size: 12px;
            line-height: 1.35;
        }

        .composition-drawer {
            margin: 0;
        }

        .legend-heading {
            margin: 0;
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .site-legend-items {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px 9px;
            margin-top: 8px;
        }

        .site-legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #cbd5e0;
            font-size: 10px;
            font-weight: 700;
        }

        button.site-legend-item {
            width: 100%;
            padding: 3px;
            border: 1px solid transparent;
            border-radius: 4px;
            text-align: left;
            background: transparent;
            cursor: pointer;
        }

        button.site-legend-item:hover,
        button.site-legend-item.is-selected {
            border-color: #63b3ed;
            background: rgba(99, 179, 237, .12);
        }

        .legend-team-switch {
            display: flex;
            gap: 5px;
            margin: 7px 0 2px;
        }

        .legend-team-switch button {
            flex: 1 1 0;
            padding: 4px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #cbd5e0;
            background: #202734;
            cursor: pointer;
            font: 800 10px/1 Inter, sans-serif;
        }

        .legend-team-switch button[data-legend-team="1"].is-selected { border-color: #fc8181; color: #fc8181; }
        .legend-team-switch button[data-legend-team="2"].is-selected { border-color: #90cdf4; color: #90cdf4; }

        .legend-composition {
            margin-top: 8px;
            overflow: visible;
            border-top: 1px solid #3b4252;
        }

        .site-legend-item .site-overview-icon {
            flex: 0 0 auto;
            transform: scale(.7);
            transform-origin: left center;
            margin-right: -8px;
        }

        .site-overview-icon {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 0;
            color: #90cdf4;
            background: transparent;
            box-shadow: none;
        }

        .site-overview-icon.team-1 { color: #fc8181; }
        .site-overview-icon.team-2 { color: #90cdf4; }
        .site-overview-icon img {
            width: auto;
            height: auto;
            max-width: 30px;
            max-height: 30px;
            object-fit: contain;
            filter:
                drop-shadow(-1px 0 0 rgba(255,255,255,.9))
                drop-shadow(1px 0 0 rgba(255,255,255,.9))
                drop-shadow(0 -1px 0 rgba(255,255,255,.9))
                drop-shadow(0 1px 0 rgba(255,255,255,.9));
        }

        .site-overview-icon.long-range img {
            filter:
                drop-shadow(-1px -1px 0 #f6e05e)
                drop-shadow(1px -1px 0 #f6e05e)
                drop-shadow(-1px 1px 0 #f6e05e)
                drop-shadow(1px 1px 0 #f6e05e)
                drop-shadow(0 1px 2px #000);
        }

        .leaflet-marker-icon.legend-highlighted .site-overview-icon img {
            filter:
                drop-shadow(-2px -2px 0 #fff7ae)
                drop-shadow(2px -2px 0 #fff7ae)
                drop-shadow(-2px 2px 0 #fff7ae)
                drop-shadow(2px 2px 0 #fff7ae)
                drop-shadow(0 0 8px #f6e05e);
        }

        .leaflet-interactive:focus {
            outline: none;
        }

        .site-popup .leaflet-popup-content { min-width: min(320px, calc(100vw - 38px)); }
        .site-popup-title { margin: 0; padding: 10px 11px 3px; font-size: 14px; }
        .site-popup .vehicle-card-grid {
            grid-template-columns: 1fr;
            max-height: 42vh;
            overflow-y: auto;
        }

        .airfield-popup { min-width: min(270px, calc(100vw - 44px)); }
        .airfield-popup-meta {
            margin: 0;
            padding: 0 11px 7px;
            color: #a0aec0;
            font-size: 11px;
        }
        .airfield-popup h3 {
            margin: 0;
            padding: 7px 11px 3px;
            border-top: 1px solid #4a5568;
            color: #a0aec0;
            font-size: 10px;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .airfield-popup-composition {
            margin: 0;
            padding: 0 11px 9px 25px;
            color: #edf2f7;
            font-size: 11px;
            line-height: 1.45;
        }

        .site-popup-unit-grid {
            display: grid;
            grid-template-columns: repeat(var(--site-popup-items, 1), minmax(0, 1fr));
            gap: 5px;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
            padding: 0 8px 9px;
        }

        .site-popup-unit {
            position: relative;
            min-width: 0;
            padding: 4px 3px 5px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #edf2f7;
            background: #202734;
            cursor: pointer;
        }

        .site-popup-unit:hover,
        .site-popup-unit:focus-visible {
            border-color: #f6e05e;
            outline: none;
            background: #2d3748;
        }

        .site-popup-unit-image {
            display: block;
            width: 100%;
            height: 54px;
            object-fit: contain;
            filter: drop-shadow(0 1px 2px #000);
        }

        .site-popup-unit-image.is-missing { display: none; }

        .site-popup-unit-label {
            display: block;
            overflow: hidden;
            margin-top: 2px;
            font-size: 9px;
            font-weight: 700;
            line-height: 1.15;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .site-popup-unit-count {
            position: absolute;
            right: 3px;
            bottom: 3px;
            padding: 1px 3px;
            border-radius: 3px;
            color: #f6e05e;
            background: rgba(15, 17, 26, .9);
            font-size: 10px;
            font-weight: 800;
        }

        .site-popup-back {
            margin: 0 8px 7px;
            padding: 4px 7px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #edf2f7;
            background: #202734;
            cursor: pointer;
            font: inherit;
            font-size: 10px;
        }

        .site-popup-back:hover,
        .site-popup-back:focus-visible {
            border-color: #f6e05e;
            outline: none;
        }

        .composition-panel h2 {
            margin: 0;
            font-size: 14px;
        }

        .composition-panel > p {
            margin: 3px 0 10px;
            color: #a0aec0;
        }

        .composition-section + .composition-section { margin-top: 9px; }

        .composition-section-title {
            margin: 0 0 4px;
            color: #a0aec0;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .composition-site {
            margin: 4px 0;
            border: 1px solid #3b4252;
            border-radius: 5px;
            background: #171c27;
        }

        .composition-site summary {
            padding: 6px 7px;
            cursor: pointer;
            font-weight: 700;
        }

        .composition-site summary::marker { color: #90cdf4; }
        .composition-site.team-1 summary { color: #fc8181; }
        .composition-site.team-2 summary { color: #90cdf4; }

        .composition-site-description {
            margin: 0;
            padding: 0 7px 6px;
            color: #cbd5e0;
        }

        .vehicle-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 6px;
            padding: 0 7px 8px;
        }

        .vehicle-card {
            overflow: hidden;
            border: 1px solid #4a5568;
            border-top: 3px solid #90cdf4;
            border-radius: 5px;
            color: #edf2f7;
            background: linear-gradient(145deg, #2a3140, #151a23);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
        }

        .vehicle-card.team-1 { border-top-color: #fc8181; }
        .vehicle-card-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 7px 4px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .vehicle-card-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .vehicle-card-icon.objective-symbol {
            display: grid;
            place-items: center;
            color: #f6e05e;
            font: 900 20px/1 sans-serif;
        }

        .vehicle-card-art {
            display: block;
            width: 100%;
            height: 116px;
            margin: 0;
            object-fit: contain;
            background: linear-gradient(180deg, rgba(8, 12, 18, .34), rgba(8, 12, 18, .72));
            filter: drop-shadow(0 1px 2px #000);
        }

        .vehicle-card-art-wrap {
            position: relative;
        }

        /* Keep timer/count badges visible when a card has no matching art. */
        .vehicle-card-art-wrap.no-art {
            min-height: 30px;
            background: linear-gradient(180deg, rgba(8, 12, 18, .34), rgba(8, 12, 18, .72));
        }

        .vehicle-card-count {
            position: absolute;
            right: 6px;
            bottom: 5px;
            z-index: 1;
            padding: 2px 5px;
            border: 1px solid rgba(246, 224, 94, .7);
            border-radius: 4px;
            color: #f6e05e;
            font-size: 11px;
            font-weight: 800;
            background: rgba(15, 17, 26, .9);
            white-space: nowrap;
        }

        .vehicle-card-timer {
            position: absolute;
            left: 6px;
            bottom: 5px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 5px 2px 3px;
            border: 1px solid rgba(246, 224, 94, .7);
            border-radius: 4px;
            color: #f6e05e;
            font-size: 11px;
            font-weight: 800;
            background: rgba(15, 17, 26, .9);
            white-space: nowrap;
        }

        .vehicle-card-timer img {
            width: 15px;
            height: 17px;
            filter: brightness(0) saturate(100%) invert(87%) sepia(83%) saturate(650%) hue-rotate(3deg) brightness(103%) contrast(95%);
        }

        .vehicle-card-timer.no-respawn {
            border-color: rgba(252, 129, 129, .9);
            color: #fc8181;
        }

        .vehicle-card-timer.no-respawn img {
            filter: brightness(0) saturate(100%) invert(66%) sepia(48%) saturate(1090%) hue-rotate(306deg) brightness(104%) contrast(98%);
        }

        .vehicle-card-header .vehicle-card-count {
            position: static;
            margin-left: auto;
        }

        .vehicle-card-role {
            padding: 0 7px 5px;
            color: #a0aec0;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .vehicle-card-depot-context {
            position: absolute;
            left: 6px;
            bottom: 5px;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px 2px 3px;
            color: #ffffff;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, .75);
            border-radius: 4px;
            background: rgba(15, 17, 26, .9);
            white-space: nowrap;
        }

        .vehicle-card-depot-context img {
            width: 15px;
            height: 17px;
            filter: brightness(0) saturate(100%) invert(87%) sepia(83%) saturate(650%) hue-rotate(3deg) brightness(103%) contrast(95%);
        }

        .vehicle-card-depot-context b {
            color: #f6e05e;
            font-weight: 800;
        }

        .vehicle-card-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1px;
            border-top: 1px solid #3b4252;
            background: #11151d;
        }

        .vehicle-card-stat {
            min-width: 0;
            padding: 5px 6px;
            color: #cbd5e0;
            font-size: 10px;
        }

        .vehicle-card-stat b {
            display: block;
            overflow: hidden;
            color: #f7fafc;
            font-size: 11px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .vehicle-card-weapons {
            margin: 0;
            padding: 6px 7px 7px;
            border-top: 1px solid #3b4252;
            color: #cbd5e0;
            font-size: 10px;
        }

        .vehicle-card-weapons strong { color: #f6e05e; }

        .leaflet-popup-content-wrapper {
            max-width: min(350px, calc(100vw - 35px));
            padding: 0;
            border: 1px solid #4a5568;
            border-radius: 6px;
            color: #edf2f7;
            background: #151a23;
        }

        .leaflet-popup-content { margin: 0; min-width: 240px; }
        .leaflet-popup-tip { background: #151a23; }
        .leaflet-popup-content .vehicle-card { border: 0; border-top: 3px solid #90cdf4; border-radius: 5px; }
        .leaflet-popup-content .vehicle-card.team-1 { border-top-color: #fc8181; }

        .unit-hover-tooltip {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 180px;
        }

        .unit-hover-icon {
            width: 42px;
            height: 30px;
            object-fit: contain;
            flex: 0 0 auto;
            filter: drop-shadow(0 1px 2px #000);
        }

        .unit-hover-text { min-width: 0; }

        .title { font-size: 15px; font-weight: 700; }
        #status { display: block; margin-top: 4px; color: #f6ad55; }

        .era-selector {
            display: block;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #3b4252;
        }

        .map-selector {
            display: block;
            margin-top: 10px;
        }

        .selector-heading {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #a0aec0;
        }

        #map-options {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }

        .map-selector label {
            display: block;
            width: 100%;
            padding: 4px 7px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            text-align: center;
        }

        .map-selector label:has(input:checked) {
            color: #0f111a;
            border-color: #63b3ed;
            background: #63b3ed;
        }

        .map-selector input { margin: 0 4px 0 0; }

        .scenario-select-row {
            display: flex;
            align-items: center;
            gap: 7px;
            width: 100%;
        }

        #scenario-options {
            min-width: 0;
            flex: 1 1 auto;
            padding: 4px 8px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            color: #edf2f7;
            background: #202734;
            cursor: pointer;
            font: 700 13px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        .icon-family-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 7px;
            color: #a0aec0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .icon-family-options {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 auto;
        }

        .icon-family-option {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 34px;
            padding: 2px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            background: #202734;
            cursor: pointer;
        }

        .icon-family-option:hover,
        .icon-family-option:focus-visible {
            border-color: #f6e05e;
            outline: none;
        }

        .icon-family-option.is-selected {
            border-color: #f6e05e;
            box-shadow: 0 0 0 1px rgba(246, 224, 94, .35);
            background: #2d3748;
        }

        .icon-family-option img {
            display: block;
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .scenario-brackets {
            flex: 0 0 auto;
            color: #f6ad55;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .scenario-brackets.is-unset {
            color: #f6ad55;
            font-style: italic;
        }

        .team-swap {
            display: block;
            width: 100%;
            margin-top: 7px;
            padding: 5px 9px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            color: #e2e8f0;
            background: #202734;
            cursor: pointer;
            font: 700 11px/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .team-swap:hover {
            border-color: #f6e05e;
            color: #fffaf0;
        }

        .team-swap:disabled {
            border-color: #3b4252;
            color: #718096;
            cursor: not-allowed;
        }

        .range-disclaimer-control {
            position: relative;
            display: none;
            width: min(330px, calc(100vw - 34px));
            margin: 0 10px 12px 0;
            padding: 10px 34px 10px 12px;
            border: 1px solid #d69e2e;
            border-radius: 7px;
            color: #fefcbf;
            background: rgba(45, 35, 10, 0.94);
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
            font: 12px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .leaflet-bottom.leaflet-left .range-disclaimer-control {
            margin: 0 10px 8px;
        }

        .range-disclaimer-control.is-visible { display: block; }

        .range-disclaimer-control strong {
            display: block;
            margin-bottom: 3px;
            color: #f6e05e;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .range-disclaimer-close {
            position: absolute;
            top: 5px;
            right: 7px;
            border: 0;
            color: #fefcbf;
            background: transparent;
            cursor: pointer;
            font: 21px/1 sans-serif;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 12px;
            margin-top: 10px;
            color: #cbd5e0;
            font-size: 12px;
        }

        .legend-item { display: inline-flex; align-items: center; gap: 5px; }
        .dot {
            width: 9px;
            height: 9px;
            border: 1px solid #111;
            border-radius: 50%;
        }

        .nato-leaflet-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 0;
        }

        .nato-leaflet-icon img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.85));
        }

        /* Fixed-size overview airfield marker: team colour inside, followed
           by a black keyline and a white outer frame. */
        .airfield-overview-icon {
            --airfield-team: #90cdf4;
            position: relative;
            display: block;
            width: 38px;
            height: 12px;
            transform-origin: 50% 50%;
            background: #ffffff;
            border-radius: 2px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
        }
        .airfield-overview-icon.team-1 { --airfield-team: #fc8181; }
        .airfield-overview-icon.team-2 { --airfield-team: #90cdf4; }
        .airfield-overview-icon::before {
            content: "";
            position: absolute;
            inset: 1px;
            background: #000000;
        }
        .airfield-overview-icon::after {
            content: "";
            position: absolute;
            inset: 2px;
            background: var(--airfield-team);
            border: 1px solid var(--airfield-team);
        }

        .bomber-map-icon img {
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.95));
        }

        /* Datamine role SVGs are deliberately white/transparent. Recolour
           them at render time instead of storing separate red/blue copies. */
        img[src$="?team=1"] {
            filter: sepia(1) saturate(14) hue-rotate(300deg) brightness(.78) contrast(1.2);
        }
        img[src$="?team=2"] {
            filter: sepia(1) saturate(10) hue-rotate(175deg) brightness(.84) contrast(1.2);
        }
        .site-overview-icon.team-1 img[src*="images/icons/nato/"] {
            filter: sepia(1) saturate(14) hue-rotate(300deg) brightness(.78) contrast(1.2)
                drop-shadow(-1px 0 0 rgba(255,255,255,.9)) drop-shadow(1px 0 0 rgba(255,255,255,.9))
                drop-shadow(0 -1px 0 rgba(255,255,255,.9)) drop-shadow(0 1px 0 rgba(255,255,255,.9));
        }
        .site-overview-icon.team-2 img[src*="images/icons/nato/"] {
            filter: sepia(1) saturate(10) hue-rotate(175deg) brightness(.84) contrast(1.2)
                drop-shadow(-1px 0 0 rgba(255,255,255,.9)) drop-shadow(1px 0 0 rgba(255,255,255,.9))
                drop-shadow(0 -1px 0 rgba(255,255,255,.9)) drop-shadow(0 1px 0 rgba(255,255,255,.9));
        }
        /* Pact symbols use a wider native canvas than NATO/vanilla symbols.
           Keep their visual footprint consistent without changing the marker
           hit area or the source artwork. */
        .nato-leaflet-icon img[data-icon-family="pact"],
        .site-overview-icon img[data-icon-family="pact"] {
            transform: none;
        }
        .site-overview-icon.team-1.long-range img[src*="images/icons/nato/"] {
            filter: sepia(1) saturate(14) hue-rotate(300deg) brightness(.78) contrast(1.2)
                drop-shadow(-1px 0 0 rgba(246,224,94,.88)) drop-shadow(1px 0 0 rgba(246,224,94,.88))
                drop-shadow(0 -1px 0 rgba(246,224,94,.88)) drop-shadow(0 1px 0 rgba(246,224,94,.88))
                drop-shadow(0 1px 2px #000);
        }
        .site-overview-icon.team-2.long-range img[src*="images/icons/nato/"] {
            filter: sepia(1) saturate(10) hue-rotate(175deg) brightness(.84) contrast(1.2)
                drop-shadow(-1px 0 0 rgba(246,224,94,.88)) drop-shadow(1px 0 0 rgba(246,224,94,.88))
                drop-shadow(0 -1px 0 rgba(246,224,94,.88)) drop-shadow(0 1px 0 rgba(246,224,94,.88))
                drop-shadow(0 1px 2px #000);
        }
        .leaflet-marker-icon.legend-highlighted .site-overview-icon.team-1 img[src*="images/icons/nato/"] {
            filter: sepia(1) saturate(12) hue-rotate(300deg) brightness(1.05)
                drop-shadow(-2px -2px 0 #fff7ae) drop-shadow(2px -2px 0 #fff7ae)
                drop-shadow(-2px 2px 0 #fff7ae) drop-shadow(2px 2px 0 #fff7ae)
                drop-shadow(0 0 8px #f6e05e);
        }
        .leaflet-marker-icon.legend-highlighted .site-overview-icon.team-2 img[src*="images/icons/nato/"] {
            filter: sepia(1) saturate(8) hue-rotate(175deg) brightness(1.1)
                drop-shadow(-2px -2px 0 #fff7ae) drop-shadow(2px -2px 0 #fff7ae)
                drop-shadow(-2px 2px 0 #fff7ae) drop-shadow(2px 2px 0 #fff7ae)
                drop-shadow(0 0 8px #f6e05e);
        }

        /* WT/Vanilla symbols are filled at render time. Give the fill a
           crisp one-pixel black keyline; grouped site symbols add a separate
           white outer keyline so the visual order is color → black → white.
           Long-range groups retain their established yellow outer keyline. */
        .nato-leaflet-icon img[data-icon-family="vanilla"] {
            filter: none;
        }
        .site-overview-icon:not(.long-range) img[data-icon-family="vanilla"] {
            filter:
                drop-shadow(-2px 0 0 #fff)
                drop-shadow(2px 0 0 #fff)
                drop-shadow(0 -2px 0 #fff)
                drop-shadow(0 2px 0 #fff);
        }
        .site-overview-icon.long-range img[data-icon-family="vanilla"] {
            filter:
                drop-shadow(-2px 0 0 #f6e05e)
                drop-shadow(2px 0 0 #f6e05e)
                drop-shadow(0 -2px 0 #f6e05e)
                drop-shadow(0 2px 0 #f6e05e)
                drop-shadow(0 2px 2px #000);
        }

        .grouped-layers {
            width: 285px;
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            padding: 7px;
            border: 1px solid #4a5568;
            border-radius: 7px;
            color: #edf2f7;
            background: rgba(15, 17, 26, 0.96);
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
            font: 12px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .layers-drawer {
            position: relative;
            transition: transform 180ms ease;
        }

        .layers-drawer.is-collapsed {
            transform: translateX(calc(100% - 29px));
        }

        .layers-drawer-toggle {
            position: absolute;
            top: 10px;
            left: -29px;
            width: 30px;
            height: 34px;
            padding: 0;
            border: 1px solid #4a5568;
            border-radius: 6px 0 0 6px;
            color: #e2e8f0;
            background: rgba(15, 17, 26, 0.96);
            cursor: pointer;
            font: 18px/1 sans-serif;
        }

        .grouped-layers details + details {
            margin-top: 4px;
        }

        .grouped-layers .force-details + .force-details {
            margin-top: 7px;
        }

        .grouped-layers summary {
            display: flex;
            align-items: center;
            gap: 5px;
            list-style: none;
            padding: 5px 7px;
            border-radius: 4px;
            background: #252a36;
            cursor: pointer;
            font-weight: 700;
            user-select: none;
        }

        .grouped-layers summary::-webkit-details-marker {
            display: none;
        }

        .folder-eye {
            position: relative;
            flex: 0 0 22px;
            width: 22px;
            height: 20px;
            padding: 0;
            border: 0;
            color: #718096;
            background: transparent;
            cursor: pointer;
            font: 15px/20px sans-serif;
            text-align: center;
        }

        .folder-eye.active {
            color: #e2e8f0;
        }

        .folder-eye.partial {
            color: #90cdf4;
        }

        .folder-eye:not(.active)::after {
            position: absolute;
            left: 3px;
            top: 9px;
            width: 16px;
            height: 2px;
            background: #fc8181;
            content: "";
            transform: rotate(-42deg);
        }

        .folder-triangle {
            flex: 0 0 10px;
            color: #a0aec0;
            transition: transform 120ms ease;
        }

        .grouped-layers details[open] > summary .folder-triangle {
            transform: rotate(90deg);
        }

        .folder-title {
            flex: 1 1 auto;
        }

        .force-details > summary {
            min-height: 34px;
            border: 1px solid #4a5568;
            font-size: 13px;
            letter-spacing: 0.04em;
        }

        .force-children {
            padding: 4px 0 2px 13px;
        }

        .force-children > details > summary {
            background: #1c2230;
            font-weight: 600;
        }

        .folder-icon {
            display: inline-flex;
            flex: 0 0 22px;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            color: #cbd5e0;
            font-size: 17px;
        }

        .folder-icon img {
            display: block;
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .folder-icon.multi {
            flex-basis: 34px;
            width: 34px;
        }

        .folder-icon.multi img {
            width: 19px;
            height: 19px;
            margin-right: -4px;
        }

        .grouped-layers .layer-options {
            padding: 4px 4px 3px 31px;
        }

        .layer-actions {
            display: flex;
            gap: 5px;
            margin: 2px 0 5px;
        }

        .layer-actions button {
            padding: 3px 7px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #e2e8f0;
            background: #1a202c;
            cursor: pointer;
            font: inherit;
        }

        .layer-actions button:hover {
            border-color: #90cdf4;
            background: #2d3748;
        }

        .global-layer-actions {
            padding: 0 0 6px;
            border-bottom: 1px solid #4a5568;
            margin-bottom: 6px;
        }

        .grouped-layers label {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 24px;
            cursor: pointer;
        }

        .grouped-layers input {
            flex: 0 0 auto;
            margin: 0;
        }

        .team-red { color: #fc8181; }
        .team-blue { color: #90cdf4; }

        .terrain-readout,
        .terrain-legend {
            padding: 6px 8px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            color: #edf2f7;
            background: rgba(15, 17, 26, 0.92);
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.48);
            font: 11px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
            backdrop-filter: blur(4px);
        }

        .terrain-readout {
            min-width: 220px;
        }

        .map-tools-control {
            width: 250px;
            padding: 8px;
            border: 1px solid #4a5568;
            border-radius: 6px;
            color: #edf2f7;
            background: rgba(15, 17, 26, 0.94);
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.48);
            font: 11px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .leaflet-bottom.leaflet-left .map-tools-control {
            margin-bottom: 42px;
            margin-left: 10px;
        }

        .map-tools-control strong {
            display: block;
            margin-bottom: 5px;
            font-size: 11px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .map-tools-actions { display: flex; flex-wrap: wrap; gap: 5px; }

        .map-tools-actions button {
            flex: 1 1 auto;
            padding: 5px 6px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #e2e8f0;
            background: #202734;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        .map-tools-actions button[aria-pressed="true"] {
            border-color: #90cdf4;
            color: #0f111a;
            background: #90cdf4;
        }

        .map-tools-status {
            min-height: 16px;
            margin-top: 5px;
            color: #a0aec0;
        }

        .brush-options {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 5px 8px;
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px solid #3b4252;
        }

        .brush-options[hidden] { display: none; }

        .los-options {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 5px 8px;
            margin-top: 7px;
            padding-top: 7px;
            border-top: 1px solid #3b4252;
        }

        .los-options[hidden] { display: none; }

        .los-options label { display: contents; }

        .los-options input {
            width: 68px;
            box-sizing: border-box;
            padding: 3px 5px;
            border: 1px solid #4a5568;
            border-radius: 3px;
            color: #edf2f7;
            background: #202734;
            font: inherit;
        }

        .los-hint {
            grid-column: 1 / -1;
            color: #a0aec0;
        }

        .brush-options label {
            display: contents;
        }

        .brush-options span {
            color: #a0aec0;
            font-weight: 700;
        }

        .brush-options select,
        .brush-options input[type="range"] {
            width: 100%;
            accent-color: #90cdf4;
        }

        .brush-options select {
            padding: 3px 5px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #edf2f7;
            background: #202734;
            font: inherit;
        }

        .ruler-waypoint {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 23px;
            height: 23px;
            border: 2px solid #e2e8f0;
            border-radius: 50%;
            color: #0f111a;
            background: #90cdf4;
            box-shadow: 0 1px 3px rgba(0,0,0,.75);
            font: 800 11px/1 Inter, sans-serif;
        }

        .ruler-waypoint { background: #f6e05e; }

        .terrain-legend {
            display: none;
            width: 205px;
        }

        .terrain-legend.visible {
            display: block;
        }

        .terrain-legend strong {
            display: block;
            margin-bottom: 4px;
        }

        .terrain-gradient {
            height: 9px;
            margin: 4px 0 2px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: linear-gradient(
                90deg,
                #184160 0%,
                #466944 2%,
                #677e4b 7%,
                #908953 12%,
                #a97e54 22%,
                #976552 36%,
                #7e6965 56%,
                #979189 76%,
                #e0ded3 100%
            );
        }

        .terrain-scale-labels {
            display: flex;
            justify-content: space-between;
            color: #cbd5e0;
            font-size: 10px;
        }

    </style>
</head>
<body>

<div class="info-panel">
    <div class="title">Nuclear Thunder Interactive Map</div>

    <div class="map-selector" id="map-selector">
        <span id="map-options">Loading maps…</span>
    </div>

    <div class="era-selector" id="scenario-selector">
        <div class="scenario-select-row">
            <select id="scenario-options" aria-label="Scenario" disabled>
                <option>Loading scenarios…</option>
            </select>
        </div>
    </div>

    <button id="team-swap" class="team-swap" type="button" aria-pressed="false">
        SWAP SIDES
    </button>

    <div class="icon-family-selector">
        <div id="icon-family-options" class="icon-family-options" role="radiogroup" aria-label="Map icon style">
            <button type="button" class="icon-family-option" data-icon-family="vanilla" aria-label="WT icons" title="WT icons">
                <img data-icon-preview="vanilla" src="images/icons/vanilla/def_spaa_radar.svg" alt="">
            </button>
            <button type="button" class="icon-family-option is-selected" data-icon-family="nato" aria-label="NATO icons" title="NATO icons">
                <img data-icon-preview="nato" src="images/icons/nato/def_nato_ally_sam_radar.svg" alt="">
            </button>
            <button type="button" class="icon-family-option" data-icon-family="pact" aria-label="USSR icons" title="USSR icons">
                <img data-icon-preview="pact" src="images/icons/pact/def_ussr_sam_radar.svg" alt="">
            </button>
        </div>
    </div>

</div>

<aside id="composition-window" class="composition-window">
    <button id="composition-window-toggle" class="drawer-toggle" type="button"
        aria-label="Collapse map legend" aria-expanded="true">‹</button>
    <section class="composition-drawer">
        <h2 class="legend-heading">Map legend</h2>
        <section id="composition-panel" class="composition-panel" aria-live="polite">
            <p>Loading map legend…</p>
        </section>
    </section>
</aside>

<div id="map"></div>

<script>
    const MAP_IMAGE = "map_4k.png";
    const TOPOGRAPHIC_IMAGE = "topographic_map.webp";
    const TERRAIN_HEIGHT_IMAGE = "terrain_height_8bit.png";
    const CITY_TOPOGRAPHIC_IMAGE = "generated/southeastern_city_heightmap/southeastern_city_topography.webp";
    const CITY_TERRAIN_HEIGHT_IMAGE = "generated/southeastern_city_heightmap/southeastern_city_height_8bit.png";
    const IMG_SIZE = 4096;
    const LOS_GRID_SIZE = 256;
    const CITY_MAP_IMAGE = "air_south_eastern_city_map.png";
    const MAP_DEFINITIONS = {
        archipelago: {
            id: "archipelago",
            label: "Archipelago",
            image: MAP_IMAGE,
            variants: ["standard", "mirror"],
            defaultVariant: "standard",
            supportsTeamSwap: true,
            supportsTerrain: true,
            terrainImage: TERRAIN_HEIGHT_IMAGE,
            terrainOverlay: TOPOGRAPHIC_IMAGE,
            terrainEncodedMin: -149,
            terrainEncodedRange: 5120,
            supportsRoads: true,
            supportsNavmesh: false,
            roadFile: "road_network.json",
            mapCoord0: [-131072, -131072],
            mapCoord1: [131072, 131072]
        },
        city: {
            id: "city",
            label: "South Eastern City",
            image: CITY_MAP_IMAGE,
            variants: ["city"],
            defaultVariant: "city",
            supportsTeamSwap: false,
            supportsTerrain: true,
            terrainImage: CITY_TERRAIN_HEIGHT_IMAGE,
            terrainOverlay: CITY_TOPOGRAPHIC_IMAGE,
            // The city extractor stores the high byte of a 16-bit normalized
            // height value; these bounds come from its sidecar metadata.
            terrainEncodedMin: -75.25747680664062,
            terrainEncodedRange: 1307.5875549316406,
            supportsRoads: true,
            supportsNavmesh: true,
            roadFile: "road_network_city.json",
            navmeshFile: "navmesh_city.json",
            // From air_south_eastern_city.blkx: this map is half the width
            // of Archipelago, not a 262 km square.
            mapCoord0: [-65536, -65536],
            mapCoord1: [65536, 65536]
        }
    };
    const mapSelectionStorageKey = "nuclear-thunder-map-selection";
    // Keep the initial presentation aligned with the game's standard NATO
    // tactical map. This is intentionally not persisted between sessions.
    let iconFamily = "nato";
    let currentMapId = sessionStorage.getItem(mapSelectionStorageKey) || "archipelago";
    if (!MAP_DEFINITIONS[currentMapId]) currentMapId = "archipelago";

    function activeMapDefinition() {
        return MAP_DEFINITIONS[currentMapId] || MAP_DEFINITIONS.archipelago;
    }

    function worldToLatLng(x, z) {
        const definition = activeMapDefinition();
        const [minX, minZ] = definition.mapCoord0;
        const [maxX, maxZ] = definition.mapCoord1;
        const px = (x - minX) / (maxX - minX) * IMG_SIZE;
        const py = (z - minZ) / (maxZ - minZ) * IMG_SIZE;
        return [py, px];
    }

    function worldRadiusToMapRadius(radiusMeters) {
        const definition = activeMapDefinition();
        return radiusMeters / (
            (definition.mapCoord1[0] - definition.mapCoord0[0]) / IMG_SIZE
        );
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function displayName(value) {
        const raw = String(value ?? "unit").replaceAll("\\", "/").toLowerCase();
        const tail = raw.split("/").pop();
        const localized = globalUnitDisplayNames[raw] || globalUnitDisplayNames[tail];
        if (localized) return localized;
        // Mission identifiers carry the nation and often an `ai` marker;
        // those are useful for data lookup but noisy in user-facing labels.
        const withoutCountry = tail.replace(
            /^(ussr|us|germ|sw|jp|it|cn|uk|fr|isr|swe|fin|pl|cs|hu|ro|za|il|ch|sp|ge|av|ukr|tur)_/i,
            ""
        );
        return withoutCountry
            .replace(/^ai_/i, "")
            .replace(/_ai(?=_|$)/ig, "")
            .replaceAll("_", " ");
    }

    const bounds = [[0, 0], [IMG_SIZE, IMG_SIZE]];
    const map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -3,
        maxZoom: 6,
        zoomSnap: 0.25,
        zoomControl: false
    });

    const infoPanel = document.querySelector(".info-panel");
    const infoDrawerToggle = document.createElement("button");
    infoDrawerToggle.type = "button";
    infoDrawerToggle.className = "drawer-toggle";
    infoDrawerToggle.setAttribute("aria-label", "Collapse left controls");
    infoDrawerToggle.setAttribute("aria-expanded", "true");
    infoDrawerToggle.textContent = "‹";
    infoDrawerToggle.addEventListener("click", () => {
        const collapsed = infoPanel.classList.toggle("is-collapsed");
        infoDrawerToggle.textContent = collapsed ? "›" : "‹";
        infoDrawerToggle.setAttribute("aria-expanded", String(!collapsed));
        infoDrawerToggle.setAttribute(
            "aria-label",
            collapsed ? "Expand left controls" : "Collapse left controls"
        );
    });
    infoPanel.appendChild(infoDrawerToggle);

    const compositionWindow = document.getElementById("composition-window");
    const compositionWindowToggle = document.getElementById("composition-window-toggle");
    compositionWindowToggle.addEventListener("click", () => {
        const collapsed = compositionWindow.classList.toggle("is-collapsed");
        compositionWindowToggle.textContent = collapsed ? "›" : "‹";
        compositionWindowToggle.setAttribute("aria-expanded", String(!collapsed));
        compositionWindowToggle.setAttribute(
            "aria-label",
            collapsed ? "Expand map legend" : "Collapse map legend"
        );
    });

    const standardMapLayer = L.imageOverlay(activeMapDefinition().image, bounds).addTo(map);
    const topographicMapLayer = L.imageOverlay(
        activeMapDefinition().terrainOverlay,
        bounds
    );
    map.fitBounds(bounds);

    const terrainCanvas = document.createElement("canvas");
    terrainCanvas.width = IMG_SIZE;
    terrainCanvas.height = IMG_SIZE;
    const terrainContext = terrainCanvas.getContext("2d", {
        willReadFrequently: true
    });
    let terrainReadoutReady = false;
    const terrainImage = new Image();
    terrainImage.addEventListener("load", () => {
        terrainContext.clearRect(0, 0, IMG_SIZE, IMG_SIZE);
        terrainContext.drawImage(terrainImage, 0, 0, IMG_SIZE, IMG_SIZE);
        terrainReadoutReady = true;
        if (terrainReadoutElement) {
            terrainReadoutElement.textContent = "Terrain elevation ready · move over the map";
        }
        if (planningPoints?.los?.length) {
            renderLineOfSight();
            updateMapToolsUi();
        }
    });
    terrainImage.addEventListener("error", () => {
        terrainReadoutReady = false;
        if (terrainReadoutElement) {
            terrainReadoutElement.textContent = "Terrain data could not be loaded for this map";
        }
        if (planningPoints?.los?.length) updateMapToolsUi();
    });
    function loadTerrainForMap(definition) {
        terrainReadoutReady = false;
        terrainContext.clearRect(0, 0, IMG_SIZE, IMG_SIZE);
        if (!definition.terrainImage) {
            if (terrainReadoutElement) {
                terrainReadoutElement.textContent = "Terrain data is unavailable for this map";
            }
            return;
        }
        terrainImage.src = definition.terrainImage;
        if (terrainReadoutElement) {
            terrainReadoutElement.textContent = "Terrain: loading compiled height data…";
        }
    }
    const terrainReadoutControl = L.control({ position: "bottomleft" });
    let terrainReadoutElement;
    terrainReadoutControl.onAdd = () => {
        terrainReadoutElement = L.DomUtil.create(
            "div",
            "terrain-readout"
        );
        terrainReadoutElement.textContent =
            "Terrain: loading compiled height data…";
        return terrainReadoutElement;
    };
    terrainReadoutControl.addTo(map);
    loadTerrainForMap(activeMapDefinition());

    const terrainLegendControl = L.control({ position: "bottomright" });
    let terrainLegendElement;
    terrainLegendControl.onAdd = () => {
        terrainLegendElement = L.DomUtil.create(
            "div",
            "terrain-legend"
        );
        terrainLegendElement.innerHTML = `
            <strong>Extracted terrain elevation</strong>
            Height data used by terrain shading and LOS
            <div class="terrain-gradient"></div>
            <div class="terrain-scale-labels">
                <span>low</span><span>0 m</span><span>high</span>
            </div>
        `;
        return terrainLegendElement;
    };
    terrainLegendControl.addTo(map);

    function refreshTerrainLegend() {
        terrainLegendElement?.classList.toggle(
            "visible",
            activeMapDefinition().supportsTerrain && map.hasLayer(topographicMapLayer)
        );
    }

    map.on("layeradd layerremove", event => {
        if (event.layer === topographicMapLayer) refreshTerrainLegend();
    });

    map.on("mousemove", event => {
        if (!terrainReadoutElement) return;
        const mapX = event.latlng.lng;
        const mapY = event.latlng.lat;
        if (
            mapX < 0 || mapX >= IMG_SIZE ||
            mapY < 0 || mapY >= IMG_SIZE
        ) {
            terrainReadoutElement.textContent = "Outside terrain grid";
            return;
        }
        const definition = activeMapDefinition();
        const [minX, minZ] = definition.mapCoord0;
        const [maxX, maxZ] = definition.mapCoord1;
        const worldX = minX + mapX / IMG_SIZE * (maxX - minX);
        const worldZ = minZ + mapY / IMG_SIZE * (maxZ - minZ);
        if (!definition.supportsTerrain || !definition.terrainImage) {
            terrainReadoutElement.textContent =
                `Terrain data is not extracted for this map · X ${worldX.toFixed(0)} m · Z ${worldZ.toFixed(0)} m`;
            return;
        }
        if (!terrainReadoutReady) {
            terrainReadoutElement.textContent =
                `X ${worldX.toFixed(0)} m · Z ${worldZ.toFixed(0)} m`;
            return;
        }
        const imageX = Math.min(IMG_SIZE - 1, Math.max(0, Math.floor(mapX)));
        const imageY = Math.min(
            IMG_SIZE - 1,
            Math.max(0, Math.floor(IMG_SIZE - 1 - mapY))
        );
        const encoded = terrainContext.getImageData(
            imageX,
            imageY,
            1,
            1
        ).data[0];
        const elevation =
            definition.terrainEncodedMin +
            encoded / 255 * definition.terrainEncodedRange;
        terrainReadoutElement.textContent =
            `Terrain ≈ ${Math.round(elevation).toLocaleString()} m · ` +
            `X ${worldX.toFixed(0)} · Z ${worldZ.toFixed(0)}`;
    });

    map.createPane("strategicTargets");
    map.getPane("strategicTargets").style.zIndex = 660;
    map.createPane("depotMarkers");
    map.getPane("depotMarkers").style.zIndex = 675;

    const selectedRangeGroup = L.layerGroup().addTo(map);
    const selectedRangeLayers = new Map();
    const selectedSamSiteRangeLayers = new Map();
    let rangeDisclaimerElement = null;
    let rangeDisclaimerSelectionKey = null;

    function clearSelectedRanges() {
        selectedRangeGroup.clearLayers();
        selectedRangeLayers.clear();
        selectedSamSiteRangeLayers.clear();
        clearRangeDisclaimer();
    }

    function clearSamSiteRanges() {
        selectedSamSiteRangeLayers.forEach(group => selectedRangeGroup.removeLayer(group));
        selectedSamSiteRangeLayers.clear();
    }

    function clearRangeDisclaimer() {
        rangeDisclaimerElement?.classList.remove("is-visible");
        rangeDisclaimerSelectionKey = null;
    }

    // Mission AI engagement limits are intentionally different from the
    // missile's physical flight distance.  The latter is useful in a card,
    // but it would overstate the area in which the AI actually launches.
    const AI_ENGAGEMENT_RANGE_OVERRIDES = {
        us_ai_sam_launcher_m192: 40000,
        us_ai_sam_launcher_m192_early: 40000,
        us_ai_sam_launcher_m901: 70000
    };

    function displayEngagementRange(unit, specs) {
        const name = String(unit?.name || "").toLowerCase();
        const missionLimit = Number(unit?.ai_engagement_range || unit?.engagement_range);
        const extractedAiLimit = Number(specs?.ai_engagement_range);
        const override = Number(AI_ENGAGEMENT_RANGE_OVERRIDES[name]);
        if (override > 0) return override;
        if (missionLimit > 0) return missionLimit;
        if (extractedAiLimit > 0) return extractedAiLimit;
        return Number(specs?.engagement_range || 0);
    }

    // A grouped SAM marker represents the whole battery.  Its range rings
    // therefore originate at the site's mission origin, not at each launcher
    // or radar's individual transform.
    function showSamSiteRanges(entry) {
        const category = operationalCategory(entry.site);
        if (!(["shortSams", "longSams"].includes(category))) return;
        const key = `site:${entry.site.name}`;
        if (selectedSamSiteRangeLayers.has(key)) return;
        const values = {
            detection: 0,
            tracking: 0,
            engagement: 0
        };
        (entry.units || []).forEach(unit => {
            const specs = globalUnitSpecs[String(unit.name || "").toLowerCase()];
            const threatSearch = Number(unit.threat_range);
            const detection = Number(
                Number.isFinite(threatSearch) && threatSearch > 0
                    ? threatSearch
                    : specs?.sensors?.detection?.nominal ||
                        Math.max(...(specs?.sensors?.detection?.scope_ranges || []), 0)
            );
            const tracking = Number(specs?.sensors?.tracking?.nominal || 0);
            const engagement = displayEngagementRange(unit, specs);
            values.detection = Math.max(values.detection, detection || 0);
            values.tracking = Math.max(values.tracking, tracking || 0);
            values.engagement = Math.max(values.engagement, engagement || 0);
        });
        if (!Object.values(values).some(value => value > 0)) return;
        const group = L.layerGroup();
        const color = teamColor(entry.site.team);
        const position = worldToLatLng(
            entry.site.world_pos[0],
            entry.site.world_pos[2]
        );
        [
            [values.detection, { color, weight: 2, opacity: 0.9, fill: false, dashArray: "9, 6" }],
            [values.tracking, { color, weight: 2, opacity: 0.95, fill: false, dashArray: "2, 5" }],
            [values.engagement, { color, fillColor: color, fillOpacity: 0.045, weight: 2.25, opacity: 1 }]
        ].forEach(([value, style]) => {
            if (!(value > 0)) return;
            L.circle(position, {
                radius: worldRadiusToMapRadius(value),
                interactive: false,
                ...style
            }).addTo(group);
        });
        if (!group.getLayers().length) return;
        group.addTo(selectedRangeGroup);
        selectedSamSiteRangeLayers.set(key, group);
    }

        ruler: L.layerGroup().addTo(map),
        flight: L.layerGroup().addTo(map),
        los: L.layerGroup().addTo(map)
    };

    function mapLatLngToWorld(latlng) {
        const definition = activeMapDefinition();
        const [minX, minZ] = definition.mapCoord0;
        const [maxX, maxZ] = definition.mapCoord1;
        return [
            minX + latlng.lng / IMG_SIZE * (maxX - minX),
            minZ + latlng.lat / IMG_SIZE * (maxZ - minZ)
        ];
    }

    function planningDistance(points) {
        return points.slice(1).reduce((total, point, index) => {
            const [startX, startZ] = mapLatLngToWorld(points[index]);
            const [endX, endZ] = mapLatLngToWorld(point);
            return total + Math.hypot(endX - startX, endZ - startZ);
        }, 0);
    }

    function planningMarker(number) {
        return L.divIcon({
            className: "",
            html: `<span class="ruler-waypoint">${number}</span>`,
            iconSize: [23, 23],
            iconAnchor: [11.5, 11.5]
        });
    }

    function renderRuler() {
        const points = planningPoints.ruler;
        const layer = planningLayers.ruler;
        layer.clearLayers();
        if (points.length > 1) {
            L.polyline(points, {
                color: "#f6e05e",
                weight: 3,
                opacity: 0.95,
                dashArray: "6, 5"
            }).addTo(layer);
        }
        points.forEach((point, index) => {
            L.marker(point, {
                icon: planningMarker(index + 1),
                interactive: false,
                keyboard: false
            }).addTo(layer);
        });
    }

    function renderFlightBrush() {
        const strokes = flightCurrentStroke
            ? [...flightStrokes, flightCurrentStroke]
            : flightStrokes;
        planningLayers.flight.clearLayers();
        strokes.forEach(stroke => {
            if (stroke.points.length < 2) return;
            L.polyline(stroke.points, {
                color: stroke.color,
                weight: stroke.size,
                opacity: 0.9,
                lineCap: "round",
                lineJoin: "round",
                smoothFactor: 1.2,
                interactive: false
            }).addTo(planningLayers.flight);
        });
    }

    function sampleTerrainElevation(latlng) {
        const definition = activeMapDefinition();
        if (!definition.supportsTerrain || !definition.terrainImage || !terrainReadoutReady) {
            return null;
        }
        const x = Number(latlng.lng);
        const y = Number(latlng.lat);
        if (!Number.isFinite(x) || !Number.isFinite(y) || x < 0 || x >= IMG_SIZE || y < 0 || y >= IMG_SIZE) {
            return null;
        }
        const imageX = Math.min(IMG_SIZE - 1, Math.max(0, Math.floor(x)));
        const imageY = Math.min(IMG_SIZE - 1, Math.max(0, Math.floor(IMG_SIZE - 1 - y)));
        const encoded = terrainContext.getImageData(imageX, imageY, 1, 1).data[0];
        return definition.terrainEncodedMin + encoded / 255 * definition.terrainEncodedRange;
    }

    function renderLineOfSight() {
        const layer = planningLayers.los;
        layer.clearLayers();
        renderLineOfSight.lastResult = null;
        const points = planningPoints.los;
        if (!points.length) return;
        const observer = points[0];
        const observerGround = sampleTerrainElevation(observer);
        L.circleMarker(observer, {
            radius: 7,
            color: "#90cdf4",
            weight: 2,
            fillColor: "#2b6cb0",
            fillOpacity: 0.95,
            interactive: false
        }).addTo(layer);
        if (observerGround === null) return;

        const observerX = Number(observer.lng);
        const observerY = Number(observer.lat);
        const pixelsPerCell = IMG_SIZE / LOS_GRID_SIZE;
        const definition = activeMapDefinition();
        const metersPerPixel = (
            definition.mapCoord1[0] - definition.mapCoord0[0]
        ) / IMG_SIZE;
        const observerHeight = observerGround + losObserverHeight;
        const state = new Uint8Array(LOS_GRID_SIZE * LOS_GRID_SIZE);
        const rayCount = LOS_GRID_SIZE * 4;
        const imageCanvas = document.createElement("canvas");
        imageCanvas.width = LOS_GRID_SIZE;
        imageCanvas.height = LOS_GRID_SIZE;
        const imageContext = imageCanvas.getContext("2d");
        const imageData = imageContext.createImageData(LOS_GRID_SIZE, LOS_GRID_SIZE);

        // Cast radial rays from the observer. The highest terrain angle seen
        // so far on each ray becomes the horizon; everything behind it is in
        // the red shadow. A 256px grid keeps this interactive on both maps.
        for (let ray = 0; ray < rayCount; ray += 1) {
            const angle = ray / rayCount * Math.PI * 2;
            const directionX = Math.cos(angle);
            const directionY = Math.sin(angle);
            const edgeDistances = [];
            if (directionX > 0) edgeDistances.push((IMG_SIZE - observerX) / directionX);
            if (directionX < 0) edgeDistances.push(-observerX / directionX);
            if (directionY > 0) edgeDistances.push((IMG_SIZE - observerY) / directionY);
            if (directionY < 0) edgeDistances.push(-observerY / directionY);
            const maxDistance = Math.min(...edgeDistances.filter(Number.isFinite));
            const steps = Math.max(1, Math.ceil(maxDistance / pixelsPerCell));
            let horizonAngle = -Infinity;
            for (let step = 1; step <= steps; step += 1) {
                const distancePixels = Math.min(maxDistance, step * pixelsPerCell);
                const x = observerX + directionX * distancePixels;
                const y = observerY + directionY * distancePixels;
                if (x < 0 || x >= IMG_SIZE || y < 0 || y >= IMG_SIZE) continue;
                const terrain = sampleTerrainElevation(L.latLng(y, x));
                if (terrain === null) continue;
                const targetAngle = Math.atan2(
                    terrain + losTargetHeight - observerHeight,
                    distancePixels * metersPerPixel
                );
                const gridX = Math.min(LOS_GRID_SIZE - 1, Math.floor(x / pixelsPerCell));
                const gridY = Math.min(LOS_GRID_SIZE - 1, Math.floor(y / pixelsPerCell));
                // Leaflet's CRS.Simple image rows run from north to south,
                // while map latitude and the terrain sampler run south to
                // north. Flip the raster row so the overlay stays anchored
                // to the clicked observer position.
                const imageRow = LOS_GRID_SIZE - 1 - gridY;
                const cellIndex = imageRow * LOS_GRID_SIZE + gridX;
                const visible = targetAngle >= horizonAngle - 0.0001;
                if (visible) {
                    horizonAngle = Math.max(horizonAngle, targetAngle);
                    state[cellIndex] = 1;
                } else {
                    state[cellIndex] = 2;
                }
            }
        }

        let visibleCells = 0;
        let blockedCells = 0;
        for (let index = 0; index < state.length; index += 1) {
            const offset = index * 4;
            if (state[index] === 1) {
                visibleCells += 1;
                imageData.data[offset] = 104;
                imageData.data[offset + 1] = 211;
                imageData.data[offset + 2] = 145;
                imageData.data[offset + 3] = 72;
            } else if (state[index] === 2) {
                blockedCells += 1;
                imageData.data[offset] = 252;
                imageData.data[offset + 1] = 129;
                imageData.data[offset + 2] = 129;
                imageData.data[offset + 3] = 92;
            }
        }
        imageContext.putImageData(imageData, 0, 0);
        L.imageOverlay(imageCanvas.toDataURL("image/png"), bounds, {
            opacity: 1,
            interactive: false,
            className: "los-viewshed-overlay"
        }).addTo(layer);
        renderLineOfSight.lastResult = {
            visibleCells,
            blockedCells,
            coverage: visibleCells + blockedCells
        };
    }

    function updateMapToolsUi() {
        rulerToolButton?.setAttribute(
            "aria-pressed", String(activeMapTool === "ruler")
        );
        flightToolButton?.setAttribute(
            "aria-pressed", String(activeMapTool === "flight")
        );
        losToolButton?.setAttribute(
            "aria-pressed", String(activeMapTool === "los")
        );
        if (!mapToolsStatus) return;
        if (activeMapTool === "ruler") {
            const points = planningPoints.ruler;
            mapToolsStatus.textContent = points.length
                ? `Ruler: ${points.length} points · ${formatDistance(planningDistance(points))}. Click map to add.`
                : "Ruler active — click the map to add points.";
        } else if (activeMapTool === "flight") {
            mapToolsStatus.textContent = flightStrokes.length
                ? `Flight brush: ${flightStrokes.length} stroke${flightStrokes.length === 1 ? "" : "s"}. Drag on the map to add.`
                : "Flight brush active — drag on the map to draw a route.";
        } else if (activeMapTool === "los") {
            const points = planningPoints.los;
            const result = renderLineOfSight.lastResult;
            if (!activeMapDefinition().supportsTerrain) {
                mapToolsStatus.textContent = points.length
                    ? "Terrain elevation is unavailable for this map."
                    : "LOS active — click an observer point on the map.";
            } else if (!terrainReadoutReady) {
                mapToolsStatus.textContent = "Loading terrain elevation…";
            } else if (result && points.length) {
                const total = result.coverage || 1;
                const visiblePercent = Math.round(result.visibleCells / total * 100);
                mapToolsStatus.textContent =
                    `Viewshed ready · ${visiblePercent}% visible · red is terrain shadow.`;
            } else {
                mapToolsStatus.textContent = points.length
                    ? "Viewshed ready — click a new point to move the observer."
                    : "LOS active — click an observer point on the map.";
            }
        } else {
            mapToolsStatus.textContent = "Choose a tool, then click on the map.";
        }
        if (flightBrushOptions) {
            flightBrushOptions.hidden = activeMapTool !== "flight";
        }
        if (losOptions) {
            losOptions.hidden = activeMapTool !== "los";
        }
    }

    function setActiveMapTool(tool) {
        activeMapTool = activeMapTool === tool ? null : tool;
        if (activeMapTool) {
            map.doubleClickZoom.disable();
        } else {
            map.doubleClickZoom.enable();
        }
        map.getContainer().style.cursor = ["flight", "los"].includes(activeMapTool) ? "crosshair" : "";
        updateMapToolsUi();
    }

    function clearPlanningTools() {
        planningPoints.ruler = [];
        planningPoints.los = [];
        flightStrokes.length = 0;
        flightCurrentStroke = null;
        planningLayers.ruler.clearLayers();
        planningLayers.flight.clearLayers();
        planningLayers.los.clearLayers();
        renderLineOfSight.lastResult = null;
        updateMapToolsUi();
    }

    function addPlanningPoint(latlng) {
        if (activeMapTool !== "ruler") return false;
        planningPoints.ruler.push(latlng);
        renderRuler();
        updateMapToolsUi();
        return true;
    }

    function addLineOfSightPoint(latlng) {
        if (activeMapTool !== "los") return false;
        planningPoints.los = [latlng];
        renderLineOfSight();
        updateMapToolsUi();
        return true;
    }

    function finishFlightStroke() {
        if (!flightCurrentStroke) return;
        if (flightCurrentStroke.points.length > 1) {
            flightStrokes.push(flightCurrentStroke);
        }
        flightCurrentStroke = null;
        map.dragging.enable();
        renderFlightBrush();
        updateMapToolsUi();
    }

    const mapToolsControl = L.control({ position: "bottomleft" });
    mapToolsControl.onAdd = () => {
        const element = L.DomUtil.create("section", "map-tools-control");
        element.innerHTML = `
            <strong>Map tools</strong>
            <div class="map-tools-actions">
                <button type="button" data-tool="ruler" aria-pressed="false">Measure</button>
                <button type="button" data-tool="los" aria-pressed="false" title="Create a terrain viewshed from one observer point">Line of sight</button>
                <button type="button" data-tool="flight" aria-pressed="false">Flight brush</button>
                <button type="button" data-tool="clear">Clear</button>
            </div>
            <div class="brush-options" hidden>
                <label><span>Colour</span><select data-tool="flight-colour" aria-label="Flight brush colour">
                    <option value="#90cdf4">Blue</option>
                    <option value="#f6e05e">Yellow</option>
                    <option value="#fc8181">Red</option>
                    <option value="#68d391">Green</option>
                    <option value="#e2e8f0">White</option>

                <label><span>Target height</span><input data-tool="los-target-height" type="number" min="0" max="1000" step="1" value="2" aria-label="Target height above ground in metres"></label>
                <small class="los-hint">Green is visible terrain; red is hidden behind the terrain horizon.</small>
            </div>
            <div class="map-tools-status" aria-live="polite"></div>
        `;
        L.DomEvent.disableClickPropagation(element);
        L.DomEvent.disableScrollPropagation(element);
        rulerToolButton = element.querySelector('[data-tool="ruler"]');
        flightToolButton = element.querySelector('[data-tool="flight"]');
        losToolButton = element.querySelector('[data-tool="los"]');
        rulerToolButton.addEventListener("click", () => setActiveMapTool("ruler"));
        flightToolButton.addEventListener("click", () => setActiveMapTool("flight"));
        losToolButton.addEventListener("click", () => setActiveMapTool("los"));
        element.querySelector('[data-tool="clear"]').addEventListener("click", clearPlanningTools);
        flightBrushOptions = element.querySelector(".brush-options");

        });
        element.querySelector('[data-tool="los-observer-height"]').addEventListener("input", event => {
            losObserverHeight = Math.max(0, Number(event.target.value) || 0);
            if (planningPoints.los.length) renderLineOfSight();
            updateMapToolsUi();
        });
        element.querySelector('[data-tool="los-target-height"]').addEventListener("input", event => {
            losTargetHeight = Math.max(0, Number(event.target.value) || 0);
            if (planningPoints.los.length) renderLineOfSight();
            updateMapToolsUi();
        });
        mapToolsStatus = element.querySelector(".map-tools-status");
        updateMapToolsUi();
        return element;
    };
    mapToolsControl.addTo(map);
    rangeDisclaimerControl.addTo(map);

    map.on("click", event => {
        if (activeMapTool === "flight") return;
        if (addPlanningPoint(event.latlng)) return;
        if (addLineOfSightPoint(event.latlng)) return;
        clearSelectedRanges();
        clearRouteSelection();
        // At detail zoom, keep the individual unit layer in place when the
        // user clicks empty map space. The grouped-site context is cleared,
        // but removing the temporary focused layer here makes units vanish
        // until the next redraw.
        clearFocusedSite({ keepDetails: map.getZoom() >= DETAIL_ZOOM });
        // Re-apply the zoom representation after clearing a grouped-site
        // selection. At detail zoom the normal unit groups must remain on the
        // map; otherwise units that were temporarily shown through the
        // focused group can appear to vanish after an empty-map click.
        syncDetailVisibility();
        if (legendCategory) {

    map.on("dblclick", event => {
        if (activeMapTool !== "ruler") return;
        event.originalEvent?.preventDefault();
        setActiveMapTool("ruler");
    });

    map.on("mousedown", event => {
        if (activeMapTool !== "flight" || event.originalEvent?.button !== 0) return;
        flightCurrentStroke = {
            points: [event.latlng],
            color: flightBrushColor,
            size: flightBrushSize
        };
        map.dragging.disable();
        event.originalEvent?.preventDefault();
    });

    map.on("mousemove", event => {
        if (!flightCurrentStroke) return;
        const points = flightCurrentStroke.points;
        const previous = points[points.length - 1];
        if (Math.hypot(previous.lat - event.latlng.lat, previous.lng - event.latlng.lng) < 0.5) return;
        points.push(event.latlng);
        renderFlightBrush();
    });

    map.on("mouseup", finishFlightStroke);
    map.getContainer().addEventListener("mouseleave", finishFlightStroke);

    function makeVisibleLayerGroup() {

    const operationalKeys = [

    const focusedDetailGroup = L.layerGroup().addTo(map);
    const detailLayersBySite = new Map();
    const overviewMarkers = [];

    const runwayOutlineLayersBySite = new Map();

    // Grouped sites use a deliberate two-step interaction: first select the

    let latestOverviewEntries = [];

    const asphaltRoadGroup = L.layerGroup();
    const gravelRoadGroup = L.layerGroup();

    function makeMissionGroups() {

            },

    function opposingLocationName(name) {
        const value = String(name || "");
        if (value.startsWith("t1_")) return `t2_${value.slice(3)}`;
        if (value.startsWith("t2_")) return `t1_${value.slice(3)}`;

    function locationsByName(records) {

    function linkLocationKey(link) {
        return [
            link.factory || "",
            link.assembly || "",
            link.target || "",
            link.resource || ""
        ].join("\u0001");

    function locationsByLink(records) {

    function oppositeLinkLocationKey(link) {

            ...link,
            factory: opposingLocationName(link.factory),
            assembly: opposingLocationName(link.assembly),
            target: opposingLocationName(link.target)
        });
    }

    function transformedLocalPosition(localPos, targetTransform) {
        if (
            !Array.isArray(localPos) || localPos.length < 3 ||
            !Array.isArray(targetTransform) || targetTransform.length < 4
        ) return null;
        const [x, y, z] = localPos.map(Number);
        if (![x, y, z].every(Number.isFinite)) return null;
        const rows = targetTransform.map(row => row.map(Number));
        if (!rows.slice(0, 4).every(row =>
            row.length >= 3 && row.slice(0, 3).every(Number.isFinite)
        )) return null;
        return [
            x * rows[0][0] + y * rows[1][0] + z * rows[2][0] + rows[3][0],
            x * rows[0][1] + y * rows[1][1] + z * rows[2][1] + rows[3][1],
            x * rows[0][2] + y * rows[1][2] + z * rows[2][2] + rows[3][2]
        ];
    }

    function translatedWorldPosition(position, sourceWorldPos, targetWorldPos) {
        if (
            !Array.isArray(position) || !Array.isArray(sourceWorldPos) ||
            !Array.isArray(targetWorldPos)
        ) return null;
        const values = [...position, ...sourceWorldPos, ...targetWorldPos].map(Number);
        if (!values.every(Number.isFinite)) return null;
        return [
            position[0] - sourceWorldPos[0] + targetWorldPos[0],
            position[1] - sourceWorldPos[1] + targetWorldPos[1],
            position[2] - sourceWorldPos[2] + targetWorldPos[2]
        ];
    }

    function moveItemsToLocation(items = [], targetItems = [], sourceSite, targetSite) {
        return items.map((item, index) => {
            const target = targetItems[index];
            const worldPos = transformedLocalPosition(
                item.local_pos,
                targetSite?.tm
            ) || target?.world_pos || translatedWorldPosition(
                item.world_pos,
                sourceSite?.world_pos,
                targetSite?.world_pos
            );
            return worldPos ? { ...item, world_pos: worldPos } : item;
        });
    }

    function moveEraItemsToLocation(
        itemsByEra = {},
        targetItemsByEra = {},
        sourceSite,
        targetSite
    ) {
        return Object.fromEntries(Object.entries(itemsByEra).map(([era, items]) => [
            era,
            moveItemsToLocation(
                items,
                targetItemsByEra[era] || [],
                sourceSite,
                targetSite
            )
        ]));
    }

    function presetBrLabel(preset) {
        // Mission balance levels map to BR in one-third steps: BR = 1 + rank/3.
        // Prefer an explicit BR supplied by generated data, but derive it from
        // the mission rank range when that field is absent.
        const raw = preset?.br ?? preset?.battle_rating ?? preset?.battleRating;
        if (Array.isArray(raw)) {
            const values = raw
                .filter(value => value !== null && value !== undefined && String(value).trim())
                .map(value => String(value).replace(/^\[|\]$/g, "").trim());
            if (values.length) return values.join("] [");
        }
        if (raw !== null && raw !== undefined && String(raw).trim()) {
            return String(raw).replace(/^\[|\]$/g, "").trim();
        }
        const range = preset?.rank_range;
        if (Array.isArray(range) && range.length >= 2) {
            const eventMinimumBr = 8.7;
            const toBr = (rank, clampMinimum = false) => {
                const value = 1 + Number(rank) / 3;
                return Number.isFinite(value)
                    ? (clampMinimum ? Math.max(eventMinimumBr, value) : value).toFixed(1)
                    : "";
            };
            const lower = toBr(range[0], true);
            const upper = toBr(range[1]);
            if (lower && upper) return `${lower}–${upper}`;
        }
        return "BR not set";
    }

    function populateScenarioSelector() {
        const options = document.getElementById("scenario-options");
        const previouslySelected = options.value;
        options.replaceChildren();
        const presets = globalPresetData.presets || [];
        presets.forEach(preset => {
            const option = document.createElement("option");
            option.value = preset.id;
            const br = presetBrLabel(preset);
            const suffix = br ? `[${br}]` : "";
            // Native select options cannot contain flex markup. Keep any
            // official BR suffix right-spaced without inventing a bracket.
            const gap = suffix
                ? "\u00a0".repeat(Math.max(3, 35 - preset.label.length - suffix.length))
                : "";
            option.textContent = `${preset.label}${gap}${suffix}`;
            options.append(option);
        });
        options.disabled = !presets.length;
        options.value = presets.some(preset => preset.id === previouslySelected)
            ? previouslySelected
            : presets[0]?.id || "";
        options.onchange = event => {
            renderMapData(event.target.value);
