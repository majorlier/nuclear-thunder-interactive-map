<!DOCTYPE html>
<html lang="en">
<head>
    <title>War Thunder Event Map Visualizer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        }

        * { box-sizing: border-box; }
        body { margin: 0; background: #0f111a; color: #f7fafc; }
        #map { width: 100vw; height: 100vh; background: #0a0a0a; }

        .info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            width: min(360px, calc(100vw - 70px));
            padding: 14px 16px;
            border: 1px solid #3b4252;
            border-radius: 8px;
            background: rgba(15, 17, 26, 0.94);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
            font-size: 13px;
            line-height: 1.45;
            backdrop-filter: blur(5px);
        }

        .title { font-size: 15px; font-weight: 700; }
        #status { display: block; margin-top: 4px; color: #f6ad55; }

        .era-selector {
            display: block;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #3b4252;
        }

        #scenario-options {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .era-selector label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 8px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            cursor: pointer;
        }

        .scenario-name {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
            font-weight: 700;
        }

        .scenario-brackets {
            flex: 0 0 auto;
            color: #f6ad55;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }

        .scenario-brackets.is-unset {
            color: #f6ad55;
            font-style: italic;
        }

        .era-selector label:has(input:checked) {
            color: #0f111a;
            border-color: #63b3ed;
            background: #63b3ed;
        }

        .era-selector label:has(input:checked) .scenario-brackets {
            color: #0f111a;
        }

        .era-selector input { margin: 0; }

        .team-swap {
            margin-top: 7px;
            padding: 5px 9px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            color: #e2e8f0;
            background: #202734;
            cursor: pointer;
            font: 700 11px/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .team-swap:hover {
            border-color: #f6e05e;
            color: #fffaf0;
        }

        .range-disclaimer-control {
            position: relative;
            display: none;
            width: min(330px, calc(100vw - 34px));
            margin: 0 10px 12px 0;
            padding: 10px 34px 10px 12px;
            border: 1px solid #d69e2e;
            border-radius: 7px;
            color: #fefcbf;
            background: rgba(45, 35, 10, 0.94);
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
            font: 12px/1.4 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .range-disclaimer-control.is-visible { display: block; }

        .range-disclaimer-control strong {
            display: block;
            margin-bottom: 3px;
            color: #f6e05e;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .range-disclaimer-close {
            position: absolute;
            top: 5px;
            right: 7px;
            border: 0;
            color: #fefcbf;
            background: transparent;
            cursor: pointer;
            font: 21px/1 sans-serif;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 5px 12px;
            margin-top: 10px;
            color: #cbd5e0;
            font-size: 12px;
        }

        .legend-item { display: inline-flex; align-items: center; gap: 5px; }
        .dot {
            width: 9px;
            height: 9px;
            border: 1px solid #111;
            border-radius: 50%;
        }

        .nato-leaflet-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 0;
        }

        .nato-leaflet-icon img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.85));
        }

        .bomber-map-icon img {
            filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.95));
        }

        .grouped-layers {
            width: 285px;
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            padding: 7px;
            border: 1px solid #4a5568;
            border-radius: 7px;
            color: #edf2f7;
            background: rgba(15, 17, 26, 0.96);
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
            font: 12px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .grouped-layers details + details {
            margin-top: 4px;
        }

        .grouped-layers .force-details + .force-details {
            margin-top: 7px;
        }

        .grouped-layers summary {
            display: flex;
            align-items: center;
            gap: 5px;
            list-style: none;
            padding: 5px 7px;
            border-radius: 4px;
            background: #252a36;
            cursor: pointer;
            font-weight: 700;
            user-select: none;
        }

        .grouped-layers summary::-webkit-details-marker {
            display: none;
        }

        .folder-eye {
            position: relative;
            flex: 0 0 22px;
            width: 22px;
            height: 20px;
            padding: 0;
            border: 0;
            color: #718096;
            background: transparent;
            cursor: pointer;
            font: 15px/20px sans-serif;
            text-align: center;
        }

        .folder-eye.active {
            color: #e2e8f0;
        }

        .folder-eye.partial {
            color: #90cdf4;
        }

        .folder-eye:not(.active)::after {
            position: absolute;
            left: 3px;
            top: 9px;
            width: 16px;
            height: 2px;
            background: #fc8181;
            content: "";
            transform: rotate(-42deg);
        }

        .folder-triangle {
            flex: 0 0 10px;
            color: #a0aec0;
            transition: transform 120ms ease;
        }

        .grouped-layers details[open] > summary .folder-triangle {
            transform: rotate(90deg);
        }

        .folder-title {
            flex: 1 1 auto;
        }

        .force-details > summary {
            min-height: 34px;
            border: 1px solid #4a5568;
            font-size: 13px;
            letter-spacing: 0.04em;
        }

        .force-children {
            padding: 4px 0 2px 13px;
        }

        .force-children > details > summary {
            background: #1c2230;
            font-weight: 600;
        }

        .folder-icon {
            display: inline-flex;
            flex: 0 0 22px;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            color: #cbd5e0;
            font-size: 17px;
        }

        .folder-icon img {
            display: block;
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .folder-icon.multi {
            flex-basis: 34px;
            width: 34px;
        }

        .folder-icon.multi img {
            width: 19px;
            height: 19px;
            margin-right: -4px;
        }

        .grouped-layers .layer-options {
            padding: 4px 4px 3px 31px;
        }

        .layer-actions {
            display: flex;
            gap: 5px;
            margin: 2px 0 5px;
        }

        .layer-actions button {
            padding: 3px 7px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #e2e8f0;
            background: #1a202c;
            cursor: pointer;
            font: inherit;
        }

        .layer-actions button:hover {
            border-color: #90cdf4;
            background: #2d3748;
        }

        .global-layer-actions {
            padding: 0 0 6px;
            border-bottom: 1px solid #4a5568;
            margin-bottom: 6px;
        }

        .grouped-layers label {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 24px;
            cursor: pointer;
        }

        .grouped-layers input {
            flex: 0 0 auto;
            margin: 0;
        }

        .team-red { color: #fc8181; }
        .team-blue { color: #90cdf4; }

        .terrain-readout,
        .terrain-legend {
            padding: 6px 8px;
            border: 1px solid #4a5568;
            border-radius: 5px;
            color: #edf2f7;
            background: rgba(15, 17, 26, 0.92);
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.48);
            font: 11px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
            backdrop-filter: blur(4px);
        }

        .terrain-readout {
            min-width: 220px;
        }

        .terrain-legend {
            display: none;
            width: 205px;
        }

        .terrain-legend.visible {
            display: block;
        }

        .terrain-legend strong {
            display: block;
            margin-bottom: 4px;
        }

        .terrain-gradient {
            height: 9px;
            margin: 4px 0 2px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: linear-gradient(
                90deg,
                #184160 0%,
                #466944 2%,
                #677e4b 7%,
                #908953 12%,
                #a97e54 22%,
                #976552 36%,
                #7e6965 56%,
                #979189 76%,
                #e0ded3 100%
            );
        }

        .terrain-scale-labels {
            display: flex;
            justify-content: space-between;
            color: #cbd5e0;
            font-size: 10px;
        }

        .guide-start {
            width: 100%;
            margin-top: 11px;
            padding: 8px 12px;
            border: 1px solid #718096;
            border-radius: 5px;
            color: #f7fafc;
            background: linear-gradient(180deg, #394151, #252a36);
            cursor: pointer;
            font: 700 12px/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .guide-start:hover {
            border-color: #f6e05e;
            background: linear-gradient(180deg, #4a5568, #2d3748);
        }

        .guide-start:disabled {
            opacity: 0.45;
            cursor: wait;
        }

        .guide-under-construction {
            margin-top: 11px;
            padding: 4px;
            border-radius: 6px;
            background: repeating-linear-gradient(
                -45deg,
                #f6e05e 0 10px,
                #1a202c 10px 20px
            );
        }

        .guide-under-construction::before {
            display: block;
            padding: 3px 7px;
            color: #171923;
            background: #f6e05e;
            content: "⚠ UNDER CONSTRUCTION ⚠";
            font: 800 10px/1 Inter, ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.12em;
            text-align: center;
        }

        .guide-under-construction .guide-start {
            margin-top: 4px;
            border-color: #171923;
        }

        .guide-layer {
            position: fixed;
            inset: 0;
            z-index: 2000;
            pointer-events: none;
        }

        .guide-layer[hidden] {
            display: none;
        }

        .guide-ticket-board {
            position: absolute;
            top: 14px;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 456px;
            padding: 7px 10px;
            border: 1px solid #718096;
            border-radius: 6px;
            background: rgba(10, 12, 18, 0.94);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
            transform: translateX(-50%);
        }

        .guide-ticket-board.attention {
            animation: guide-ticket-attention 1.05s ease-in-out infinite;
        }

        @keyframes guide-ticket-attention {
            0%, 100% {
                border-color: #718096;
                box-shadow:
                    0 4px 18px rgba(0, 0, 0, 0.65),
                    0 0 0 0 rgba(246, 224, 94, 0);
            }
            50% {
                border-color: #f6e05e;
                box-shadow:
                    0 4px 18px rgba(0, 0, 0, 0.65),
                    0 0 0 5px rgba(246, 224, 94, 0.42),
                    0 0 24px rgba(246, 224, 94, 0.65);
            }
        }

        .guide-ticket-side {
            position: relative;
            flex: 1;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-align: center;
        }

        .guide-ticket-side strong {
            display: block;
            margin-top: 1px;
            color: #f7fafc;
            font-size: 18px;
            letter-spacing: 0.02em;
        }

        .guide-ticket-divider {
            width: 1px;
            align-self: stretch;
            background: #4a5568;
        }

        .guide-escalation {
            min-width: 112px;
            color: #f6e05e;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-align: center;
        }

        .guide-escalation-icons {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 3px;
        }

        .guide-escalation-icon {
            width: 27px;
            height: 27px;
            opacity: 0.3;
            filter:
                brightness(0)
                saturate(100%)
                invert(88%)
                sepia(80%)
                saturate(875%)
                hue-rotate(350deg)
                brightness(101%)
                contrast(94%);
            transition: opacity 180ms ease, filter 180ms ease;
        }

        .guide-escalation-icon.active {
            opacity: 1;
            filter:
                brightness(0)
                saturate(100%)
                invert(88%)
                sepia(80%)
                saturate(875%)
                hue-rotate(350deg)
                brightness(101%)
                contrast(94%)
                drop-shadow(1px 0 0 #ff3030)
                drop-shadow(-1px 0 0 #ff3030)
                drop-shadow(0 1px 0 #ff3030)
                drop-shadow(0 -1px 0 #ff3030)
                drop-shadow(0 0 5px #ff3030);
        }

        .guide-escalation-loss {
            display: block;
            margin-top: 2px;
            color: #cbd5e0;
            font-size: 7px;
            letter-spacing: 0.04em;
        }

        .guide-ticket-board.ticket-hit {
            animation: guide-ticket-hit 520ms ease-out;
        }

        @keyframes guide-ticket-hit {
            0% {
                border-color: #fff;
                box-shadow:
                    0 4px 18px rgba(0, 0, 0, 0.65),
                    0 0 0 7px rgba(255, 92, 92, 0.55),
                    0 0 30px rgba(255, 92, 92, 0.9);
            }
            100% {
                border-color: #718096;
                box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
            }
        }

        .guide-ticket-delta {
            position: absolute;
            left: 50%;
            bottom: -19px;
            color: #ff7777;
            font: 900 16px/1 Inter, ui-sans-serif, system-ui, sans-serif;
            text-shadow: 0 2px 4px #000, 0 0 8px currentColor;
            pointer-events: none;
            animation: guide-ticket-delta 900ms ease-out forwards;
            transform: translateX(-50%);
        }

        @keyframes guide-ticket-delta {
            0% {
                opacity: 0;
                transform: translate(-50%, 5px) scale(0.8);
            }
            22% {
                opacity: 1;
                transform: translate(-50%, 0) scale(1.15);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -16px) scale(1);
            }
        }

        .guide-dialogue {
            position: absolute;
            left: 50%;
            bottom: 22px;
            display: grid;
            grid-template-columns: 118px minmax(0, 1fr);
            width: min(900px, calc(100vw - 28px));
            min-height: 174px;
            overflow: hidden;
            border: 1px solid #718096;
            border-radius: 9px;
            background: rgba(15, 17, 26, 0.97);
            box-shadow: 0 12px 38px rgba(0, 0, 0, 0.72);
            pointer-events: auto;
            transform: translateX(-50%);
            backdrop-filter: blur(7px);
        }

        .guide-portrait {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 14px 10px;
            border-right: 1px solid #4a5568;
            color: #f6e05e;
            background:
                radial-gradient(circle at 50% 35%, #4a5568 0 17px, transparent 18px),
                linear-gradient(145deg, #252a36, #151923);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-align: center;
        }

        .guide-rank {
            font-size: 34px;
            line-height: 1;
            text-shadow: 0 2px 5px #000;
        }

        .guide-content {
            display: flex;
            min-width: 0;
            flex-direction: column;
            padding: 14px 16px 12px;
        }

        .guide-kicker {
            color: #90cdf4;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .guide-speaker {
            margin-top: 2px;
            color: #f6e05e;
            font-size: 15px;
            font-weight: 800;
        }

        .guide-text {
            flex: 1;
            margin: 7px 0 12px;
            color: #edf2f7;
            font-size: 15px;
            line-height: 1.45;
        }

        .guide-term {
            padding: 0 2px;
            color: var(--guide-term-color);
            border-bottom: 2px solid var(--guide-term-color);
            border-radius: 2px;
            cursor: pointer;
            font-weight: 800;
            text-shadow: 0 1px 3px #000;
            transition: opacity 140ms ease, background 140ms ease;
        }

        .guide-term:hover,
        .guide-term.active {
            background: color-mix(
                in srgb,
                var(--guide-term-color) 24%,
                transparent
            );
        }

        .guide-term.muted {
            opacity: 0.3;
        }

        .guide-region-band {
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .guide-footer {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .guide-progress {
            margin-right: auto;
            color: #a0aec0;
            font-size: 11px;
        }

        .guide-button {
            min-width: 76px;
            padding: 6px 11px;
            border: 1px solid #4a5568;
            border-radius: 4px;
            color: #edf2f7;
            background: #252a36;
            cursor: pointer;
            font: 700 12px/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .guide-button:hover:not(:disabled) {
            border-color: #90cdf4;
            background: #2d3748;
        }

        .guide-button.primary {
            border-color: #b7791f;
            color: #111318;
            background: #f6e05e;
        }

        .guide-button:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .guide-map-label {
            padding: 5px 8px;
            border: 1px solid #f6e05e;
            color: #f7fafc;
            background: rgba(15, 17, 26, 0.94);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
            font: 700 11px/1.35 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .guide-map-label::before {
            border-top-color: #f6e05e;
        }

        .guide-pulse-icon {
            width: 34px;
            height: 34px;
            border: 3px solid #f6e05e;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(246, 224, 94, 0.75);
            animation: guide-pulse 1.4s ease-out infinite;
        }

        .guide-aircraft-icon {
            color: var(--guide-aircraft-color, #90cdf4);
            font-size: 34px;
            line-height: 38px;
            text-align: center;
            text-shadow:
                0 2px 4px #000,
                0 0 9px currentColor;
            transform: rotate(-35deg);
        }

        .guide-cas-aircraft-icon {
            width: 100%;
            height: 100%;
            filter:
                brightness(0)
                saturate(100%)
                invert(67%)
                sepia(37%)
                saturate(1057%)
                hue-rotate(166deg)
                brightness(101%)
                contrast(95%)
                drop-shadow(0 2px 3px #000)
                drop-shadow(0 0 7px #63b3ed);
            transform: rotate(0deg);
            transform-origin: 50% 50%;
            will-change: transform;
        }

        .guide-strike-aircraft {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .guide-strike-aircraft img {
            width: 100%;
            height: 100%;
            transform-origin: 50% 50%;
            will-change: transform;
        }

        .guide-strike-aircraft.red img {
            filter:
                brightness(0) saturate(100%) invert(57%) sepia(89%)
                saturate(2380%) hue-rotate(321deg) brightness(104%)
                contrast(103%) drop-shadow(0 2px 3px #000)
                drop-shadow(0 0 7px #ff6666);
        }

        .guide-strike-aircraft.blue img {
            filter:
                brightness(0) saturate(100%) invert(71%) sepia(42%)
                saturate(1057%) hue-rotate(166deg) brightness(101%)
                contrast(95%) drop-shadow(0 2px 3px #000)
                drop-shadow(0 0 7px #63b3ed);
        }

        .guide-altitude-badge {
            position: absolute;
            left: 44px;
            top: -4px;
            width: max-content;
            padding: 3px 5px;
            border: 1px solid currentColor;
            border-radius: 4px;
            color: #8ff0a4;
            background: rgba(10, 13, 20, 0.94);
            box-shadow: 0 2px 5px #000;
            font: 900 9px/1.15 Inter, ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.04em;
        }

        .guide-altitude-badge.high {
            color: #ffcf70;
        }

        .guide-radar-ping {
            width: 28px;
            height: 28px;
            border: 3px solid #8ce7ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #63d8ff;
            animation: guide-radar-ping 1.7s ease-out infinite;
        }

        .guide-nuclear-aircraft {
            position: relative;
            width: 100%;
            height: 100%;
            color: var(--guide-aircraft-color);
            font-size: 38px;
            line-height: 48px;
            text-align: center;
            text-shadow: 0 2px 4px #000, 0 0 9px currentColor;
        }

        .guide-nuclear-aircraft .guide-cas-aircraft-icon {
            display: inline-block;
            transform: rotate(0deg);
        }

        .guide-nuclear-yield {
            position: absolute;
            left: 38px;
            top: -7px;
            width: max-content;
            padding: 3px 5px;
            border: 1px solid #f6e05e;
            border-radius: 10px;
            color: #111318;
            background: #f6e05e;
            box-shadow: 0 0 8px rgba(246, 224, 94, 0.8);
            font: 900 9px/1 Inter, ui-sans-serif, system-ui, sans-serif;
        }

        .guide-nuclear-flash {
            width: 80px;
            height: 80px;

            background:
                radial-gradient(circle, #fff 0 8%, #fff6a6 15%,

                drop-shadow(0 0 15px #fff)
                drop-shadow(0 0 28px #ffb020);

        @keyframes guide-nuclear-flash {
            0% {

        .guide-hp-counter {

        .guide-hp-track {

            border-radius: 4px;
            background: #2d3748;
        }

        .guide-hp-fill {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #ef4444, #f6e05e, #65d68b);

        @keyframes guide-radar-ping {

            }

                opacity: 0;
                transform: scale(9);
            }

        .guide-resource-counter {
            width: 156px;
            padding: 6px 8px 7px;
            border: 1px solid #718096;

            color: #f7fafc;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.72);
            font: 800 10px/1.2 Inter, ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0.04em;
        }

        .guide-resource-row + .guide-resource-row {
            margin-top: 6px;
        }

        .guide-resource-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .guide-resource-name {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
        }

        .guide-resource-symbol {
            width: 13px;
            height: 13px;
            border-radius: 3px;
            background: currentColor;
            box-shadow: 0 0 7px currentColor;
        }

        .guide-resource-row[data-resource="fuel"] {
            color: #65d68b;
        }

        .guide-resource-row[data-resource="ammo"] {
            color: #ffb347;
        }

        .guide-resource-track {
            height: 6px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.13);
        }

        .guide-resource-fill {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .guide-destroyed-target {
            width: 34px;
            height: 34px;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            color: #ff6b6b;
            background: rgba(25, 10, 12, 0.86);
            box-shadow: 0 0 10px rgba(255, 80, 80, 0.9);
            font: 900 25px/28px Inter, sans-serif;
            text-align: center;
        }

        .guide-rocket-icon {
            width: 100%;
            height: 100%;
            filter:
                drop-shadow(0 1px 2px #000)
                drop-shadow(0 0 7px #ffb347);
            transform: rotate(0deg);
            transform-origin: 50% 50%;
            will-change: transform, opacity;
        }

        .guide-explosion-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background:
                radial-gradient(circle, #fff7ae 0 10%, #ffb020 18%, #ef4444 40%, rgba(239, 68, 68, 0) 72%);
            filter: drop-shadow(0 0 8px #ff6b1a);
            animation: guide-explosion 900ms ease-out forwards;
        }

        @keyframes guide-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(246, 224, 94, 0.75);
                transform: scale(0.82);
            }
            70% {
                box-shadow: 0 0 0 17px rgba(246, 224, 94, 0);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(246, 224, 94, 0);
                transform: scale(0.82);
            }
        }

        @keyframes guide-explosion {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }
            25% {
                opacity: 1;
                transform: scale(1.25);
            }

                transform: scale(1.8);

        @media (max-width: 620px) {
            .guide-ticket-board {

        }
    </style>
</head>
<body>

<script>
    const MAP_IMAGE = "map_4k.png";
    const TOPOGRAPHIC_IMAGE = "topographic_map.webp";
    const TERRAIN_HEIGHT_IMAGE = "terrain_height_8bit.png";
    const MAP_SPAN = 262144;
    const HALF_SPAN = MAP_SPAN / 2;
    const IMG_SIZE = 4096;
    const WORLD_METERS_PER_MAP_UNIT = MAP_SPAN / IMG_SIZE;
    const TERRAIN_ENCODED_MIN = -149;
    const TERRAIN_ENCODED_RANGE = 5120;

    function worldToLatLng(x, z) {
        const px = (x + HALF_SPAN) / MAP_SPAN * IMG_SIZE;
        const py = (HALF_SPAN + z) / MAP_SPAN * IMG_SIZE;
        return [py, px];
    }

    function worldRadiusToMapRadius(radiusMeters) {
        return radiusMeters / WORLD_METERS_PER_MAP_UNIT;
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function displayName(value) {
        const tail = String(value ?? "unit").split("/").pop();
        return tail.replaceAll("_", " ");
    }

    const bounds = [[0, 0], [IMG_SIZE, IMG_SIZE]];
    const map = L.map("map", {
        crs: L.CRS.Simple,
        minZoom: -3,
        maxZoom: 6,
        zoomSnap: 0.25,
        zoomControl: false
    });

    const standardMapLayer = L.imageOverlay(MAP_IMAGE, bounds).addTo(map);
    const topographicMapLayer = L.imageOverlay(
        TOPOGRAPHIC_IMAGE,
        bounds
    );
    map.fitBounds(bounds);

    const terrainCanvas = document.createElement("canvas");
    terrainCanvas.width = IMG_SIZE;
    terrainCanvas.height = IMG_SIZE;
    const terrainContext = terrainCanvas.getContext("2d", {
        willReadFrequently: true
    });
    let terrainReadoutReady = false;
    const terrainImage = new Image();
    terrainImage.addEventListener("load", () => {
        terrainContext.drawImage(terrainImage, 0, 0);
        terrainReadoutReady = true;
    });
    terrainImage.src = TERRAIN_HEIGHT_IMAGE;

    const terrainReadoutControl = L.control({ position: "bottomleft" });
    let terrainReadoutElement;
    terrainReadoutControl.onAdd = () => {
        terrainReadoutElement = L.DomUtil.create(
            "div",
            "terrain-readout"
        );
        terrainReadoutElement.textContent =
            "Terrain: loading compiled height data…";
        return terrainReadoutElement;
    };
    terrainReadoutControl.addTo(map);

    const terrainLegendControl = L.control({ position: "bottomright" });
    let terrainLegendElement;
    terrainLegendControl.onAdd = () => {
        terrainLegendElement = L.DomUtil.create(
            "div",
            "terrain-legend"
        );
        terrainLegendElement.innerHTML = `
            <strong>Compiled terrain elevation</strong>
            100 m contours · darker 500 m contours
            <div class="terrain-gradient"></div>
            <div class="terrain-scale-labels">
                <span>sea</span><span>0 m</span><span>2,500 m</span><span>5,000 m</span>
            </div>
        `;
        return terrainLegendElement;
    };
    terrainLegendControl.addTo(map);

    function refreshTerrainLegend() {
        terrainLegendElement?.classList.toggle(
            "visible",
            map.hasLayer(topographicMapLayer)
        );
    }

    map.on("layeradd layerremove", event => {
        if (event.layer === topographicMapLayer) refreshTerrainLegend();
    });

    map.on("mousemove", event => {
        if (!terrainReadoutElement) return;
        const mapX = event.latlng.lng;
        const mapY = event.latlng.lat;
        if (
            mapX < 0 || mapX >= IMG_SIZE ||
            mapY < 0 || mapY >= IMG_SIZE
        ) {
            terrainReadoutElement.textContent = "Outside terrain grid";
            return;
        }
        const worldX = mapX * WORLD_METERS_PER_MAP_UNIT - HALF_SPAN;
        const worldZ = mapY * WORLD_METERS_PER_MAP_UNIT - HALF_SPAN;
        if (!terrainReadoutReady) {
            terrainReadoutElement.textContent =
                `X ${worldX.toFixed(0)} m · Z ${worldZ.toFixed(0)} m`;
            return;
        }
        const imageX = Math.min(IMG_SIZE - 1, Math.max(0, Math.floor(mapX)));
        const imageY = Math.min(
            IMG_SIZE - 1,
            Math.max(0, Math.floor(IMG_SIZE - 1 - mapY))
        );
        const encoded = terrainContext.getImageData(
            imageX,
            imageY,
            1,
            1
        ).data[0];
        const elevation =
            TERRAIN_ENCODED_MIN +
            encoded / 255 * TERRAIN_ENCODED_RANGE;
        terrainReadoutElement.textContent =
            `Terrain ≈ ${Math.round(elevation).toLocaleString()} m · ` +
            `X ${worldX.toFixed(0)} · Z ${worldZ.toFixed(0)}`;
    });

    map.createPane("strategicTargets");
    map.getPane("strategicTargets").style.zIndex = 660;
    map.createPane("depotMarkers");
    map.getPane("depotMarkers").style.zIndex = 675;
    map.createPane("guideSupportUnits");
    map.getPane("guideSupportUnits").style.zIndex = 620;

    const selectedRangeGroup = L.layerGroup().addTo(map);
    const selectedRangeLayers = new Map();
    let rangeDisclaimerElement = null;
    let rangeDisclaimerSelectionKey = null;

    function clearSelectedRanges() {
        selectedRangeGroup.clearLayers();
        selectedRangeLayers.clear();
        clearRangeDisclaimer();
    }

    function clearRangeDisclaimer() {
        rangeDisclaimerElement?.classList.remove("is-visible");
        rangeDisclaimerSelectionKey = null;
    }

    const rangeDisclaimerControl = L.control({ position: "bottomright" });
    rangeDisclaimerControl.onAdd = () => {
        const element = L.DomUtil.create("aside", "range-disclaimer-control");
        element.innerHTML = `
            <button class="range-disclaimer-close" type="button" aria-label="Close range notice">×</button>
            <strong>Range guide only</strong>
            Any radar and missile ranges shown on this map are extracted
            reference values, not representative of exact in-game performance.
            Actual detection and engagement depend on terrain, altitude, target
            aspect, vehicle configuration, and game/AI logic.
        `;
        L.DomEvent.disableClickPropagation(element);
        L.DomEvent.disableScrollPropagation(element);
        element.querySelector("button").addEventListener("click", event => {
            L.DomEvent.stop(event);
            clearRangeDisclaimer();
        });
        rangeDisclaimerElement = element;
        return element;
    };
    rangeDisclaimerControl.addTo(map);

    map.on("click", () => {
        clearSelectedRanges();
        clearRouteSelection();
    });

    function makeVisibleLayerGroup() {
        return L.layerGroup().addTo(map);
    }

    const operationalKeys = [
        "strongpoints",
        "vehicleDepots",
        "fuelAmmoDepots",
        "shortSams",
        "longSams",
        "ewRadars",
        "airfields",
        "strategic",
        "fleet"
    ];

    function makeOperationalUnitGroups() {
        return Object.fromEntries(
            operationalKeys.map(key => [key, makeVisibleLayerGroup()])
        );
    }

    const unitGroups = {
        1: makeOperationalUnitGroups(),
        2: makeOperationalUnitGroups()
    };

    const asphaltRoadGroup = L.layerGroup();
    const gravelRoadGroup = L.layerGroup();

    function makeMissionGroups() {
        return {
            strongpoints: {
                objectives: L.layerGroup(),
                capture: L.layerGroup()
            },
            vehicleDepots: {
                objectives: L.layerGroup().addTo(map),
                capture: L.layerGroup(),
                armored: L.layerGroup()
            },
            fuelAmmoDepots: {
                objectives: L.layerGroup().addTo(map),
                capture: L.layerGroup(),
                convoy: L.layerGroup()
            },
            airfields: {
                runways: L.layerGroup().addTo(map),
                capture: L.layerGroup()
            },
            strategic: {
                mlrsSpawn: L.layerGroup(),
                tbmSpawn: L.layerGroup(),
                mlrsMove: L.layerGroup(),
                tbmMove: L.layerGroup(),
                targets: L.layerGroup(),
                bombers: L.layerGroup()
            },
            fleet: {
                routes: L.layerGroup().addTo(map)
            }
        };
    }

    const missionGroups = {
        1: makeMissionGroups(),
        2: makeMissionGroups()
    };

    function makeCoverageCategory() {
        return {
            detection: L.layerGroup(),
            tracking: L.layerGroup(),
            engagement: L.layerGroup()
        };
    }

    function makeTeamCoverage() {
        return Object.fromEntries(
            operationalKeys.map(key => [key, makeCoverageCategory()])
        );
    }

    const coverageGroups = {
        1: makeTeamCoverage(),
        2: makeTeamCoverage()
    };

    const renderedGroups = [
        ...Object.values(unitGroups).flatMap(groups => Object.values(groups)),
        ...Object.values(missionGroups).flatMap(groups => [
            groups.airfields.runways,
            groups.fleet.routes
        ]),
        ...Object.values(coverageGroups).flatMap(categories =>
            Object.values(categories).flatMap(groups => Object.values(groups))
        )
    ];

    let globalSiteData = [];
    let globalMapVariants = {};
    let globalMissionLogicVariants = {};
    let globalPresetData = { presets: [], variants: [] };
    let globalBrackets = { presets: {} };
    let globalUnitSpecs = {};
    let globalMissionLogic = null;
    let globalConvoyRoutes = new Map();
    let globalArmoredRoutes = new Map();
    let globalRoadGraph = null;
    let globalSiteLocations = new Map();
    let globalMissionSiteLocations = new Map();
    let globalMobileFireLocations = new Map();
    let globalBomberSpawnLocations = new Map();
    let globalStrategicTargetLocations = new Map();
    let globalConvoyLinkLocations = new Map();
    let globalArmoredLinkLocations = new Map();
    const routeVisuals = new Map();
    const selectedDepotGroup = L.layerGroup().addTo(map);
    let selectedRouteKeys = new Set();
    let selectedDepotName = null;
    const mapVariantStorageKey = "nuclear-thunder-map-variant";
    let currentMapVariant = sessionStorage.getItem(mapVariantStorageKey) || "standard";

    function opposingLocationName(name) {
        const value = String(name || "");
        if (value.startsWith("t1_")) return `t2_${value.slice(3)}`;
        if (value.startsWith("t2_")) return `t1_${value.slice(3)}`;
        return value;
    }

    function locationsByName(records) {
        return new Map(records.map(record => [record.name, record]));
    }

    function linkLocationKey(link) {
        return [
            link.factory || "",
            link.assembly || "",
            link.target || "",
            link.resource || ""
        ].join("\u0001");
    }

    function locationsByLink(records) {
        return new Map(records.map(record => [linkLocationKey(record), record]));
    }

    function oppositeLinkLocationKey(link) {
        return linkLocationKey({
            ...link,
            factory: opposingLocationName(link.factory),
            assembly: opposingLocationName(link.assembly),
            target: opposingLocationName(link.target)
        });
    }

    function transformedLocalPosition(localPos, targetTransform) {
        if (
            !Array.isArray(localPos) || localPos.length < 3 ||
            !Array.isArray(targetTransform) || targetTransform.length < 4
        ) return null;
        const [x, y, z] = localPos.map(Number);
        if (![x, y, z].every(Number.isFinite)) return null;
        const rows = targetTransform.map(row => row.map(Number));
        if (!rows.slice(0, 4).every(row =>
            row.length >= 3 && row.slice(0, 3).every(Number.isFinite)
        )) return null;
        return [
            x * rows[0][0] + y * rows[1][0] + z * rows[2][0] + rows[3][0],
            x * rows[0][1] + y * rows[1][1] + z * rows[2][1] + rows[3][1],
            x * rows[0][2] + y * rows[1][2] + z * rows[2][2] + rows[3][2]
        ];
    }

    function translatedWorldPosition(position, sourceWorldPos, targetWorldPos) {
        if (
            !Array.isArray(position) || !Array.isArray(sourceWorldPos) ||
            !Array.isArray(targetWorldPos)
        ) return null;
        const values = [...position, ...sourceWorldPos, ...targetWorldPos].map(Number);
        if (!values.every(Number.isFinite)) return null;
        return [
            position[0] - sourceWorldPos[0] + targetWorldPos[0],
            position[1] - sourceWorldPos[1] + targetWorldPos[1],
            position[2] - sourceWorldPos[2] + targetWorldPos[2]
        ];
    }

    function moveItemsToLocation(items = [], targetItems = [], sourceSite, targetSite) {
        return items.map((item, index) => {
            const target = targetItems[index];
            const worldPos = transformedLocalPosition(
                item.local_pos,
                targetSite?.tm
            ) || target?.world_pos || translatedWorldPosition(
                item.world_pos,
                sourceSite?.world_pos,
                targetSite?.world_pos
            );
            return worldPos ? { ...item, world_pos: worldPos } : item;
        });
    }

    function moveEraItemsToLocation(
        itemsByEra = {},
        targetItemsByEra = {},
        sourceSite,
        targetSite
    ) {
        return Object.fromEntries(Object.entries(itemsByEra).map(([era, items]) => [
            era,
            moveItemsToLocation(
                items,
                targetItemsByEra[era] || [],
                sourceSite,
                targetSite
            )
        ]));
    }

    // Every t1_ location in the extracted mission has a matching t2_ location.
    // Keep each faction's own unit set, but move every unit to its matching
    // opposing location. The two factions can use different-sized batteries,
    // so source-local coordinates prevent extra units from being left behind.
    function moveMapSiteToOpposingLocation(site) {
        // Standard and mirror missions have authored coordinates for every
        // object. The selected dataset is already in the correct location.
        return site;
    }

    function moveWorldRecordToOpposingLocation(record, locations) {
        return record;
    }

    function moveMobileFireUnitToOpposingLocation(unit) {
        return unit;
    }

    function moveLinkToOpposingLocation(link, locations) {
        return link;
    }

    function updateTeamSwapUi() {
        const swapButton = document.getElementById("team-swap");
        const mirrored = currentMapVariant === "mirror";
        swapButton.setAttribute("aria-pressed", String(mirrored));
        swapButton.textContent = mirrored
            ? "⇄ Restore standard locations"
            : "⇄ Swap REDFOR / BLUFOR locations";
        document.getElementById("legend-redfor").innerHTML =
            '<i class="dot" style="background:#fc8181"></i>' +
            "REDFOR units";
        document.getElementById("legend-blufor").innerHTML =
            '<i class="dot" style="background:#90cdf4"></i>' +
            "BLUFOR units";
    }

    function selectedPresetId() {
        return document.querySelector('input[name="era"]:checked')?.value ||
            globalPresetData.presets?.[0]?.id || "";
    }

    function presetDisplayName(presetId) {
        return globalPresetData.presets?.find(preset => preset.id === presetId)
            ?.label || presetId;
    }

    function bracketsForPreset(preset) {
        const brackets = globalBrackets?.presets?.[preset.id];
        return Array.isArray(brackets)
            ? brackets.filter(value => typeof value === "string" && value.trim())
            : [];
    }

    function populateScenarioSelector() {
        const options = document.getElementById("scenario-options");
        options.replaceChildren();
        (globalPresetData.presets || []).forEach((preset, index) => {
            const label = document.createElement("label");

                renderMapData(event.target.value);
            });
            name.append(input, ` ${preset.label}`);

            bracketLabel.className = "scenario-brackets";

    function operationalCategory(site) {
        const siteName = String(site.name || "").toLowerCase();
        const sourceGroup = String(site.source_group || "").toLowerCase();
        if (sourceGroup === "ships") return "fleet";
        if (
            sourceGroup === "tankmodels" &&
            (
                siteName.includes("tactical_missile") ||
                siteName.includes("tbm") ||
                siteName.includes("mlrs")
            )
        ) return "strategic";
        if (siteName.includes("longrange_radar")) return "ewRadars";
        if (siteName.includes("airfield")) return "airfields";
        if (
            siteName.includes("fuel_storage") ||
            siteName.includes("ammo_storage")
        ) return "fuelAmmoDepots";
        if (/t[12]_base_/.test(siteName)) return "vehicleDepots";
        if (siteName.includes("long_sam_site")) return "longSams";
        if (
            siteName.includes("short_sam_site") ||
            siteName.includes("sam_cover_foundation") ||
            siteName.includes("spaa_cover_foundation")
        ) return "shortSams";
        return "strongpoints";
    }

    function drawRunway(runway, team) {
        const [startX, , startZ] = runway.start;
        const [endX, , endZ] = runway.end;
        const width = runway.width || 80;
        const dx = endX - startX;
        const dz = endZ - startZ;
        const length = Math.hypot(dx, dz);
        if (!length) return;

        const normalX = -dz / length;
        const normalZ = dx / length;
        const halfWidth = width / 2;
        const corners = [
            worldToLatLng(startX + normalX * halfWidth, startZ + normalZ * halfWidth),
            worldToLatLng(startX - normalX * halfWidth, startZ - normalZ * halfWidth),
            worldToLatLng(endX - normalX * halfWidth, endZ - normalZ * halfWidth),
            worldToLatLng(endX + normalX * halfWidth, endZ + normalZ * halfWidth)
        ];

        L.polygon(corners, {
            color: "#e2e8f0",
            fillColor: "#2d3748",
            fillOpacity: 0.85,
            weight: 2
        }).bindTooltip(`<b>Landing strip</b><br>Width: ${width} m`)
            .addTo((missionGroups[team] || missionGroups[1]).airfields.runways);

        L.polyline([
            worldToLatLng(startX, startZ),
            worldToLatLng(endX, endZ)
        ], {
            color: "#f6e05e",
            weight: 2,
            dashArray: "8, 8"
        }).addTo((missionGroups[team] || missionGroups[1]).airfields.runways);
    }

    function worldPathDistance(points) {
        let total = 0;
        for (let index = 1; index < points.length; index += 1) {
            const previous = points[index - 1];
            const current = points[index];
            total += Math.hypot(
                current[0] - previous[0],
                current[2] - previous[2]
            );
        }
        return total;
    }

    function makeMinHeap() {
        const heap = [];
        return {
            get size() {
                return heap.length;
            },
            push(priority, node) {
                let index = heap.length;
                heap.push([priority, node]);
                while (index > 0) {
                    const parent = Math.floor((index - 1) / 2);
                    if (heap[parent][0] <= priority) break;
                    heap[index] = heap[parent];
                    index = parent;
                }
                heap[index] = [priority, node];
            },
            pop() {
                if (!heap.length) return null;
                const root = heap[0];
                const tail = heap.pop();
                if (heap.length && tail) {
                    let index = 0;
                    while (true) {
                        const left = index * 2 + 1;
                        const right = left + 1;
                        if (left >= heap.length) break;
                        let child = left;
                        if (
                            right < heap.length &&
                            heap[right][0] < heap[left][0]
                        ) {
                            child = right;
                        }
                        if (heap[child][0] >= tail[0]) break;
                        heap[index] = heap[child];
                        index = child;
                    }
                    heap[index] = tail;
                }
                return root;
            }
        };
    }

    function buildRoadGraph(roads, joinTolerance = 50) {
        const nodes = [];
        const roadIds = [];
        const edges = [];

        function addEdge(from, to, distance) {
            edges[from].push([to, distance]);
            edges[to].push([from, distance]);
        }

        roads.forEach((road, roadIndex) => {
            let previousIndex = null;
            (road.points || []).forEach(point => {
                const nodeIndex = nodes.length;
                nodes.push(point);
                roadIds.push(roadIndex);
                edges.push([]);
                if (previousIndex != null) {
                    addEdge(
                        previousIndex,
                        nodeIndex,
                        Math.hypot(
                            point[0] - nodes[previousIndex][0],
                            point[2] - nodes[previousIndex][2]
                        )
                    );
                }
                previousIndex = nodeIndex;
            });
        });

        // Separate spline objects often meet within a few metres without
        // sharing an identical control point. Join the nearest point from each
        // neighbouring road inside a small spatial-hash cell.
        const buckets = new Map();
        nodes.forEach((point, nodeIndex) => {
            const cellX = Math.floor(point[0] / joinTolerance);
            const cellZ = Math.floor(point[2] / joinTolerance);
            const nearestByRoad = new Map();

            for (let offsetX = -1; offsetX <= 1; offsetX += 1) {
                for (let offsetZ = -1; offsetZ <= 1; offsetZ += 1) {
                    const bucket = buckets.get(
                        `${cellX + offsetX}:${cellZ + offsetZ}`
                    ) || [];
                    bucket.forEach(otherIndex => {
                        const otherRoad = roadIds[otherIndex];
                        if (otherRoad === roadIds[nodeIndex]) return;
                        const other = nodes[otherIndex];
                        if (Math.abs(point[1] - other[1]) > 20) return;
                        const distance = Math.hypot(
                            point[0] - other[0],
                            point[2] - other[2]
                        );
                        if (distance > joinTolerance) return;
                        const existing = nearestByRoad.get(otherRoad);
                        if (!existing || distance < existing.distance) {
                            nearestByRoad.set(otherRoad, {
                                nodeIndex: otherIndex,
                                distance
                            });
                        }
                    });
                }
            }

            nearestByRoad.forEach(join => {
                addEdge(nodeIndex, join.nodeIndex, join.distance);
            });

            const key = `${cellX}:${cellZ}`;
            if (!buckets.has(key)) buckets.set(key, []);
            buckets.get(key).push(nodeIndex);
        });

        return { nodes, edges };
    }

    function nearestRoadNode(nodes, worldPoint) {
        let nearestIndex = -1;
        let nearestDistanceSquared = Infinity;
        nodes.forEach((node, index) => {
            const distanceSquared =
                Math.pow(node[0] - worldPoint[0], 2) +
                Math.pow(node[2] - worldPoint[2], 2);
            if (distanceSquared < nearestDistanceSquared) {
                nearestIndex = index;
                nearestDistanceSquared = distanceSquared;
            }
        });
        return nearestIndex;
    }

    function findRoadPath(graph, from, to) {
        const { nodes, edges } = graph;
        const start = nearestRoadNode(nodes, from);
        const goal = nearestRoadNode(nodes, to);
        if (start < 0 || goal < 0) return null;

        const distance = new Float64Array(nodes.length);
        distance.fill(Infinity);
        distance[start] = 0;

        const previous = new Int32Array(nodes.length);
        previous.fill(-1);
        const queue = makeMinHeap();
        queue.push(0, start);

        function heuristic(nodeIndex) {
            return Math.hypot(
                nodes[nodeIndex][0] - nodes[goal][0],
                nodes[nodeIndex][2] - nodes[goal][2]
            );
        }

        while (queue.size) {
            const item = queue.pop();
            if (!item) break;
            const [estimatedTotal, current] = item;
            if (
                estimatedTotal >
                distance[current] + heuristic(current) + 0.001
            ) {
                continue;
            }
            if (current === goal) break;

            edges[current].forEach(([next, edgeDistance]) => {
                const candidate = distance[current] + edgeDistance;
                if (candidate >= distance[next]) return;
                distance[next] = candidate;
                previous[next] = current;
                queue.push(candidate + heuristic(next), next);
            });
        }

        if (!Number.isFinite(distance[goal])) return null;
        const nodePath = [];
        for (let current = goal; current >= 0; current = previous[current]) {
            nodePath.push(current);
            if (current === start) break;
        }
        if (nodePath[nodePath.length - 1] !== start) return null;
        nodePath.reverse();

        const worldPoints = [
            from,
            ...nodePath.map(nodeIndex => nodes[nodeIndex]),
            to
        ];
        return {
            worldPoints,
            distance: worldPathDistance(worldPoints),
            entranceDistance: Math.hypot(
                from[0] - nodes[start][0],
                from[2] - nodes[start][2]
            ),
            exitDistance: Math.hypot(
                to[0] - nodes[goal][0],
                to[2] - nodes[goal][2]
            )
        };
    }

    function buildRoadRoutes(graph, links, keyFunction) {
        const routes = new Map();
        links.forEach(link => {
            const route = findRoadPath(graph, link.from, link.to);
            if (route) routes.set(keyFunction(link), route);
        });
        return routes;
    }

    function convoyRoute(link) {
        if (link.locationSwapped && globalRoadGraph) {
            const swappedRoadRoute = findRoadPath(
                globalRoadGraph,
                link.from,
                link.to
            );
            if (swappedRoadRoute) return swappedRoadRoute;
        }
        return globalConvoyRoutes.get(convoyRouteKey(link)) || {
            worldPoints: [link.from, link.to],
            distance: worldPathDistance([link.from, link.to]),
            entranceDistance: 0,
            exitDistance: 0
        };
    }

    function armoredRoute(link) {
        if (link.locationSwapped && globalRoadGraph) {
            const swappedRoadRoute = findRoadPath(
                globalRoadGraph,
                link.from,
                link.to
            );
            if (swappedRoadRoute) return swappedRoadRoute;
        }
        const extractedRoute = globalArmoredRoutes.get(
            armoredRouteKey(link)
        );
        if (extractedRoute) return extractedRoute;
        const roadRoute = (
            globalRoadGraph &&
            link?.from?.length >= 3 &&
            link?.to?.length >= 3
        ) ? findRoadPath(globalRoadGraph, link.from, link.to) : null;
        if (roadRoute) {
            globalArmoredRoutes.set(armoredRouteKey(link), roadRoute);
            return roadRoute;
        }
        return {
            worldPoints: [link.from, link.to],
            distance: worldPathDistance([link.from, link.to]),
            entranceDistance: 0,
            exitDistance: 0
        };
    }

    function applyRouteStyle(routeVisual, hovered = false) {
        const selected = selectedRouteKeys.has(routeVisual.key);
        routeVisual.line.setStyle({
            weight: selected ? 3.7 : hovered ? 3 : routeVisual.baseWeight,
            opacity: selected ? 1 : hovered ? 0.95 : routeVisual.baseOpacity
        });
        routeVisual.halo.setStyle({
            opacity: selected ? 0.72 : hovered ? 0.34 : 0,
            weight: selected ? 7 : 6
        });
    }

    function refreshRouteHighlights() {
        routeVisuals.forEach(routeVisual => applyRouteStyle(routeVisual));
    }

    function clearRouteSelection() {
        selectedRouteKeys = new Set();
        selectedDepotName = null;
        selectedDepotGroup.clearLayers();
        refreshRouteHighlights();
    }

    function stopLeafletClick(event) {
        if (event?.originalEvent) {
            L.DomEvent.stopPropagation(event.originalEvent);
        }
    }

    function selectRoute(routeKey, event) {
        stopLeafletClick(event);
        selectedDepotName = null;
        selectedDepotGroup.clearLayers();
        selectedRouteKeys = selectedRouteKeys.has(routeKey)
            ? new Set()
            : new Set([routeKey]);
        refreshRouteHighlights();
    }

    function selectDepotRoutes(site, position, event) {
        stopLeafletClick(event);
        const wasSelected = selectedDepotName === site.name;
        selectedDepotGroup.clearLayers();
        selectedDepotName = wasSelected ? null : site.name;
        selectedRouteKeys = new Set();

        if (!wasSelected) {
            routeVisuals.forEach(routeVisual => {
                if (routeVisual.endpoints.includes(site.name)) {
                    selectedRouteKeys.add(routeVisual.key);
                    L.polyline(routeVisual.positions, {
                        color: "#f7fafc",
                        weight: 7,
                        opacity: 0.72,
                        dashArray: routeVisual.dashArray,
                        interactive: false
                    }).addTo(selectedDepotGroup);
                    L.polyline(routeVisual.positions, {
                        color: routeVisual.color,
                        weight: 3.7,
                        opacity: 1,
                        dashArray: routeVisual.dashArray,
                        interactive: false
                    }).addTo(selectedDepotGroup);
                }
            });
            L.circleMarker(position, {
                pane: "strategicTargets",
                radius: 20,
                color: "#f7fafc",
                fill: false,
                weight: 3,
                opacity: 0.9,
                interactive: false
            }).addTo(selectedDepotGroup);
        }
        refreshRouteHighlights();
    }

    function drawSelectableRoute({
        key,
        endpoints,
        route,
        color,
        dashArray,
        tooltip,
        group,
        baseWeight = 2,
        baseOpacity = 0.72
    }) {
        const positions = route.worldPoints.map(point =>
            worldToLatLng(point[0], point[2])
        );
        const halo = L.polyline(positions, {
            color: "#f7fafc",
            weight: 6,
            opacity: 0,
            dashArray,
            interactive: false
        }).addTo(group);
        const line = L.polyline(positions, {
            color,
            weight: baseWeight,
            opacity: baseOpacity,
            dashArray,
            interactive: false
        }).addTo(group);
        const hitLine = L.polyline(positions, {
            color: "#ffffff",
            weight: 16,
            opacity: 0.001
        }).bindTooltip(tooltip).addTo(group);
        const routeVisual = {
            key,
            endpoints,
            line,
            halo,
            hitLine,
            positions,
            color,
            dashArray,
            baseWeight,
            baseOpacity
        };
        routeVisuals.set(key, routeVisual);
        hitLine.on("mouseover", () => applyRouteStyle(routeVisual, true));
        hitLine.on("mouseout", () => applyRouteStyle(routeVisual));
        hitLine.on("click", event => selectRoute(key, event));
        return routeVisual;
    }

        if (selectedRangeLayers.has(selectionKey)) {
            selectedRangeGroup.removeLayer(selectedRangeLayers.get(selectionKey));

    function drawUnit(unit, site) {
        const [x, , z] = unit.world_pos;
        const unitLatLng = worldToLatLng(x, z);
        const role = String(unit.role || "vehicle").toLowerCase();
        const name = String(unit.name || "unit");
        const teamGroups = unitGroups[site.team] || unitGroups[1];
        const categoryKey = operationalCategory(site);
        const targetGroup = teamGroups[categoryKey];
        const specs = globalUnitSpecs[name.toLowerCase()];
        const threatRange = unit.threat_range && !specs
            ? `<br>Threat range: ${Number(unit.threat_range).toLocaleString()} m`
            : "";
        const preset = unit.preset
            ? `<br>Preset: ${escapeHtml(unit.preset)}`
            : "";

        let specificationDetails = "";
        if (specs) {
            const details = [];
            const detection = specs.sensors?.detection;
            const tracking = specs.sensors?.tracking;
            const irst = specs.sensors?.irst;
            if (detection?.nominal) {
                details.push(`AI detection: ${formatDistance(detection.nominal)}`);
            }
            if (tracking?.nominal) {
                details.push(`AI tracking: ${formatDistance(tracking.nominal)}`);
            }
            if (irst?.nominal) {
                details.push(`IRST: ${formatDistance(irst.nominal)}`);
            }
            if (specs.engagement_range) {
                details.push(`Engagement: ${formatDistance(specs.engagement_range)}`);
            }
            if (specs.target_channels) {
                details.push(`Target channels: ${escapeHtml(specs.target_channels)}`);
            }
            if (specs.maximum_speed_kph) {
                details.push(`Maximum speed: ${escapeHtml(specs.maximum_speed_kph)} km/h`);
            }
            (specs.weapons || []).slice(0, 3).forEach(weapon => {
                const minimum = Number(weapon.minimum || 0);
                const maximum = Number(weapon.effective_maximum || 0);
                const ammo = weapon.ammo == null ? "" : ` · ${weapon.ammo} rounds`;
                const guidance = weapon.guidance
                    ? ` · ${escapeHtml(displayName(weapon.guidance))}`
                    : "";
                details.push(
                    `${escapeHtml(displayName(weapon.name))}: ` +
                    `${formatDistance(minimum)}–${formatDistance(maximum)}` +
                    `${guidance}${ammo}`
                );
            });
            if (details.length) {
                specificationDetails = `<br>${details.join("<br>")}`;
            }

            const teamCoverage = coverageGroups[site.team] || coverageGroups[1];
            const coverageCategory = teamCoverage[categoryKey];

            if (detection?.nominal) {
                L.circle(unitLatLng, {
                    radius: worldRadiusToMapRadius(detection.nominal),
                    color: teamColor(site.team),
                    fill: false,
                    weight: 1.5,
                    opacity: 0.75,
                    dashArray: "8, 6",
                    interactive: false
                }).addTo(coverageCategory.detection);
            }
            if (tracking?.nominal) {
                L.circle(unitLatLng, {
                    radius: worldRadiusToMapRadius(tracking.nominal),
                    color: teamColor(site.team),
                    fill: false,
                    weight: 1.25,
                    opacity: 0.8,
                    dashArray: "2, 5",
                    interactive: false
                }).addTo(coverageCategory.tracking);
            }
            if (specs.engagement_range) {
                L.circle(unitLatLng, {
                    radius: worldRadiusToMapRadius(specs.engagement_range),
                    color: teamColor(site.team),
                    fillColor: teamColor(site.team),
                    fillOpacity: 0.025,
                    weight: 1.5,
                    opacity: 0.9,
                    interactive: false
                }).addTo(coverageCategory.engagement);
            }
        }

        const marker = L.marker(unitLatLng, {
            icon: natoIcon(site.team, unitIconType(unit, site), 28),
            guideSiteName: site.name,
            guideUnitRole: role
        }).bindTooltip(`
            <b>${escapeHtml(displayName(name))}</b><br>
            Role: ${escapeHtml(displayName(role))}<br>
            Site: ${escapeHtml(site.name)}
            ${preset}${threatRange}<br>
            Position: [${x.toFixed(1)}, ${z.toFixed(1)}]
            ${specificationDetails}
        `).addTo(targetGroup);
        marker.on("click", event => {
            if (event.originalEvent) {
                L.DomEvent.stopPropagation(event.originalEvent);
            }
            const selectionKey = [
                site.team,
                site.name,
                name,
                x.toFixed(2),
                z.toFixed(2)
            ].join(":");
            const rangeSelection = toggleSelectedUnitRanges(
                selectionKey,
                unitLatLng,
                unit,
                site,
                specs
            );
            if (isGroundUnit(unit, site)) {
                const closesDisclaimer = rangeSelection === "removed" || (
                    rangeSelection === "unavailable" &&
                    rangeDisclaimerSelectionKey === selectionKey
                );
                if (closesDisclaimer) {
                    clearRangeDisclaimer();
                } else {
                    showRangeDisclaimer(selectionKey);
                }
            }
            marker.openTooltip();
        });

    }

    function drawVehicleDepotBuilding(building, site) {
        if (operationalCategory(site) !== "vehicleDepots") return false;
        const name = String(building.name || "").toLowerCase();
        let iconType = null;
        let buildingLabel = null;
        if (name.includes("ammo_storage")) {
            iconType = "ammo_storage";
            buildingLabel = "Internal ammunition storage";
        } else if (name.includes("fuel_storage")) {
            iconType = "fuel_storage";
            buildingLabel = "Internal fuel storage";
        }
        // The tank factory occupies the site origin, where the normal assembly
        // depot marker is already drawn. Avoid placing a duplicate marker there.
        if (!iconType) return false;

        const [x, , z] = building.world_pos;
        const targetGroup =
            (unitGroups[site.team] || unitGroups[1]).vehicleDepots;
        L.marker(worldToLatLng(x, z), {
            icon: natoIcon(site.team, iconType, 26),
            guideSiteName: site.name,
            guideUnitRole: "building"
        }).bindTooltip(`
            <b>${escapeHtml(buildingLabel)}</b><br>
            Assembly depot: ${escapeHtml(site.name)}<br>
            Structure: ${escapeHtml(displayName(building.name))}<br>
            Position: [${x.toFixed(1)}, ${z.toFixed(1)}]
        `).addTo(targetGroup);
        return true;
    }

    function renderMapData(selectedEra) {
        clearSelectedRanges();
        renderedGroups.forEach(group => group.clearLayers());

        const counts = {
            sites: 0,
            runways: 0,
            launchers: 0,
            radars: 0,
            vehicles: 0,
            ships: 0,
            shipRoutes: 0,
            depotBuildings: 0
        };

        globalSiteData.forEach(sourceSite => {
            const site = moveMapSiteToOpposingLocation(sourceSite);
            counts.sites += 1;
            (site.runways || []).forEach(runway => {
                counts.runways += 1;
                drawRunway(runway, site.team);
            });

            if (site.route?.points?.length) {
                counts.shipRoutes += 1;
                drawShipRoute(site.route, site);
            }

            const units = site.units_by_era?.[selectedEra] || [];
            units.forEach(unit => {
                const role = String(unit.role || "").toLowerCase();
                const name = String(unit.name || "").toLowerCase();
                if (site.source_group === "ships" || role === "ship") {
                    counts.ships += 1;
                } else if (role.includes("radar") || name.includes("radar")) {
                    counts.radars += 1;
                } else if (role.includes("launcher") || role === "spaa") {
                    counts.launchers += 1;
                } else {
                    counts.vehicles += 1;
                }
                drawUnit(unit, site);
            });

            const buildings = site.buildings_by_era?.[selectedEra] || [];
            buildings.forEach(building => {
                if (drawVehicleDepotBuilding(building, site)) {
                    counts.depotBuildings += 1;
                }
            });
        });

        const status = document.getElementById("status");
        status.style.color = "#68d391";
        status.innerHTML = `
            <b>${escapeHtml(presetDisplayName(selectedEra))}</b>:
            ${counts.launchers} launcher/SPAA ·
            ${counts.radars} radar ·
            ${counts.vehicles} strongpoint/other units ·
            ${counts.depotBuildings} depot storage buildings ·
            ${counts.ships} ships
        `;
    }

    function formatDistance(meters) {
        const value = Number(meters);
        if (!Number.isFinite(value)) return "unknown";
        if (value >= 1000) {
            return `${(value / 1000).toLocaleString(undefined, {
                maximumFractionDigits: 1
            })} km`;
        }
        return `${value.toLocaleString()} m`;
    }

    function addGroupedLayerControl(forces) {
        const control = L.control({ position: "topright" });
        control.onAdd = () => {
            const container = L.DomUtil.create("div", "grouped-layers");
            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.disableScrollPropagation(container);

            function descendantOptions(node) {
                return [
                    ...(node.options || []),
                    ...(node.children || []).flatMap(descendantOptions)
                ];
            }

            function setOptionVisibility(option, visible) {
                option.checkbox.checked = visible;
                if (visible && !map.hasLayer(option.layer)) {
                    option.layer.addTo(map);
                } else if (!visible && map.hasLayer(option.layer)) {
                    map.removeLayer(option.layer);
                }
            }

            function refreshFolderEye(node) {
                if (!node.eyeButton) return;
                const options = descendantOptions(node);
                const visibleCount = options.filter(option =>
                    map.hasLayer(option.layer)
                ).length;
                const anyVisible = visibleCount > 0;
                const allVisible = visibleCount === options.length;
                node.eyeButton.classList.toggle("active", anyVisible);
                node.eyeButton.classList.toggle(
                    "partial",
                    anyVisible && !allVisible
                );
                node.eyeButton.title = anyVisible
                    ? `Hide all ${node.title}`
                    : `Show all ${node.title}`;
                node.eyeButton.setAttribute(
                    "aria-label",
                    node.eyeButton.title
                );
                node.eyeButton.setAttribute(
                    "aria-pressed",
                    String(anyVisible)
                );
            }

            function refreshAllFolderEyes() {
                function refreshTree(node) {
                    refreshFolderEye(node);
                    (node.children || []).forEach(refreshTree);
                }
                forces.forEach(refreshTree);
            }

            function makeHeaderIcon(node) {
                const icon = document.createElement("span");
                icon.className = "folder-icon";
                if (node.iconType) {
                    const iconTypes = Array.isArray(node.iconType)
                        ? node.iconType
                        : [node.iconType];
                    if (iconTypes.length > 1) icon.classList.add("multi");
                    iconTypes.forEach(iconType => {
                        const image = document.createElement("img");
                        image.src = natoIconPath(node.team, iconType);
                        image.alt = "";
                        icon.appendChild(image);
                    });
                } else {
                    icon.textContent = node.glyph || "•";
                }
                return icon;
            }

            function renderNode(node, isForce = false) {
                const details = document.createElement("details");
                details.open = Boolean(node.open);
                if (isForce) details.classList.add("force-details");
                const summary = document.createElement("summary");
                const eyeButton = document.createElement("button");
                eyeButton.type = "button";
                eyeButton.className = "folder-eye";
                eyeButton.textContent = "◉";
                node.eyeButton = eyeButton;
                eyeButton.addEventListener("click", event => {
                    event.preventDefault();
                    event.stopPropagation();
                    const options = descendantOptions(node);
                    const anyVisible = options.some(option =>
                        map.hasLayer(option.layer)
                    );
                    options.forEach(option =>
                        setOptionVisibility(option, !anyVisible)
                    );
                    refreshAllFolderEyes();
                });

                const triangle = document.createElement("span");
                triangle.className = "folder-triangle";
                triangle.textContent = "▸";
                triangle.setAttribute("aria-hidden", "true");

                const title = document.createElement("span");
                title.className = "folder-title";
                title.textContent = node.title;
                summary.append(
                    eyeButton,
                    triangle,
                    makeHeaderIcon(node),
                    title
                );
                if (node.team === 1) summary.classList.add("team-red");
                if (node.team === 2) summary.classList.add("team-blue");
                details.appendChild(summary);

                if (node.children?.length) {
                    const children = document.createElement("div");
                    children.className = "force-children";
                    node.children.forEach(child => {
                        children.appendChild(renderNode(child));
                    });
                    details.appendChild(children);
                }

                if (node.options?.length) {
                    const options = document.createElement("div");
                    options.className = "layer-options";
                    node.options.forEach(option => {
                        const label = document.createElement("label");
                        const checkbox = document.createElement("input");
                        checkbox.type = "checkbox";
                        checkbox.checked = map.hasLayer(option.layer);
                        option.checkbox = checkbox;
                        checkbox.addEventListener("change", () => {
                            if (checkbox.checked) {
                                option.layer.addTo(map);
                            } else {
                                map.removeLayer(option.layer);
                            }
                            refreshAllFolderEyes();
                        });
                        label.append(
                            checkbox,
                            document.createTextNode(option.label)
                        );
                        options.appendChild(label);
                    });
                    details.appendChild(options);
                }
                return details;
            }

            forces.forEach(force => {
                container.appendChild(renderNode(force, true));
            });
            refreshAllFolderEyes();
            return container;
        };
        control.addTo(map);
    }

        const counter = team === 1
