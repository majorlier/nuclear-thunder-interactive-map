        const current = Number(
            counter.textContent.replace(/[^\d-]/g, "")
        ) || 0;
        counter.textContent = Math.max(
            0,
            current + delta
        ).toLocaleString();
        updateGuideEscalation();

        guideTicketBoard.classList.remove("ticket-hit");
        void guideTicketBoard.offsetWidth;
        guideTicketBoard.classList.add("ticket-hit");
        const deltaLabel = document.createElement("span");
        deltaLabel.className = "guide-ticket-delta";
        deltaLabel.textContent = delta > 0 ? `+${delta}` : `${delta}`;
        counter.parentElement.appendChild(deltaLabel);
        scheduleGuideTimeout(() => {
            deltaLabel.remove();
            guideTicketBoard.classList.remove("ticket-hit");
        }, 920);
    }

    function updateGuideEscalation() {
        const redTickets = Number(
            guideRedTickets.textContent.replace(/[^\d-]/g, "")
        ) || 0;
        const blueTickets = Number(
            guideBlueTickets.textContent.replace(/[^\d-]/g, "")
        ) || 0;
        const ticketsLost =
            Math.max(0, GUIDE_TICKET_POOL - redTickets) +
            Math.max(0, GUIDE_TICKET_POOL - blueTickets);
        guideEscalationIcons.forEach((icon, index) => {
            icon.classList.toggle(
                "active",
                ticketsLost >= GUIDE_ESCALATION_THRESHOLDS[index]
            );
        });
        const nextThreshold = GUIDE_ESCALATION_THRESHOLDS.find(
            threshold => ticketsLost < threshold
        );
        guideEscalationLoss.textContent = nextThreshold
            ? `${ticketsLost.toLocaleString()} / ` +
                `${nextThreshold.toLocaleString()} lost`
            : `${ticketsLost.toLocaleString()} lost · maximum stage`;
    }

    function guideOverviewRegions() {
        const missionSites = globalMissionLogic?.sites || [];
        const mapSites = globalSiteData || [];
        const mobileUnits = globalMissionLogic?.mobile_fire_units || [];

        function siteNumber(item) {
            const match = String(item?.name || "").match(/_(\d+)$/);
            return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
        }

        function numberedPoints(items) {
            return [...items]
                .sort((a, b) => siteNumber(a) - siteNumber(b))
                .map(guideWorldPosition)
                .filter(Boolean);
        }

        function frontlinePoints(items) {
            const entries = items
                .map(item => ({
                    item,
                    point: guideWorldPosition(item)
                }))
                .filter(entry => entry.point);
            if (entries.length < 3) {
                return entries.map(entry => entry.point);
            }
            const meanX = entries.reduce(
                (sum, entry) => sum + entry.point[0],
                0
            ) / entries.length;
            const meanZ = entries.reduce(
                (sum, entry) => sum + entry.point[1],
                0
            ) / entries.length;
            let xx = 0;
            let zz = 0;
            let xz = 0;
            entries.forEach(entry => {
                const dx = entry.point[0] - meanX;
                const dz = entry.point[1] - meanZ;
                xx += dx * dx;
                zz += dz * dz;
                xz += dx * dz;
            });
            const angle = 0.5 * Math.atan2(2 * xz, xx - zz);
            const cos = Math.cos(angle);
            const sin = Math.sin(angle);
            return entries
                .sort((a, b) => {
                    const aProjection =
                        (a.point[0] - meanX) * cos +
                        (a.point[1] - meanZ) * sin;
                    const bProjection =
                        (b.point[0] - meanX) * cos +
                        (b.point[1] - meanZ) * sin;
                    return aProjection - bProjection;
                })
                .map(entry => entry.point);
        }

        function teamSites(collection, team, predicate) {
            return collection.filter(
                item => item.team === team && predicate(item)
            );
        }

        function teamChains(builder) {
            return [1, 2].flatMap(team => builder(team));
        }

        return [
            {
                key: "strongpoints",

    function smoothGuideRegionChain(points, samplesPerSegment = 10) {
        if (points.length < 3) return points;
        const smoothed = [];
        for (let index = 0; index < points.length - 1; index += 1) {
            const p0 = points[Math.max(0, index - 1)];
            const p1 = points[index];
            const p2 = points[index + 1];
            const p3 = points[Math.min(points.length - 1, index + 2)];
            for (
                let sample = 0;
                sample < samplesPerSegment;
                sample += 1
            ) {
                const t = sample / samplesPerSegment;
                const t2 = t * t;
                const t3 = t2 * t;
                smoothed.push([
                    0.5 * (
                        2 * p1[0] +
                        (-p0[0] + p2[0]) * t +
                        (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 +
                        (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3
                    ),
                    0.5 * (
                        2 * p1[1] +
                        (-p0[1] + p2[1]) * t +
                        (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 +
                        (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3
                    )
                ]);
            }
        }
        smoothed.push(points[points.length - 1]);
        return smoothed;
    }

    function guideRegionBand(points, color, width, targetGroup) {
        const chain = points.filter(Boolean);
        if (!chain.length) return;
        const positions = smoothGuideRegionChain(chain).map(point =>

        );
        if (positions.length === 1) {
            L.circleMarker(positions[0], {
                radius: width / 2,
                color,
                fillColor: color,
                fillOpacity: 0.14,
                opacity: 0.85,
                weight: 2.5,
                interactive: false
            }).addTo(targetGroup);
            return;
        }
        L.polyline(positions, {
            color,
            opacity: 0.14,
            weight: width,
            className: "guide-region-band",
            interactive: false
        }).addTo(targetGroup);
        L.polyline(positions, {
            color,
            opacity: 0.88,
            weight: 2.5,
            className: "guide-region-band",
            interactive: false
        }).addTo(targetGroup);
    }

    function animateGuideMarker(
        marker,
        positions,
        duration = 7600,
        options = {}
    ) {
        if (positions.length < 2) return;
        const cumulative = [0];
        for (let index = 1; index < positions.length; index += 1) {
            const previous = positions[index - 1];
            const current = positions[index];
            cumulative.push(
                cumulative[index - 1] +
                Math.hypot(
                    current.lat - previous.lat,
                    current.lng - previous.lng
                )
            );
        }
        const totalDistance = cumulative[cumulative.length - 1];
        if (!(totalDistance > 0)) return;
        const startedAt = performance.now();

        function frame(now) {
            const elapsed = (now - startedAt) / duration;
            const phase = options.loop === false
                ? Math.min(1, elapsed)
                : elapsed % 1;
            const eased = phase < 0.5
                ? 2 * phase * phase
                : 1 - Math.pow(-2 * phase + 2, 2) / 2;
            const targetDistance = eased * totalDistance;
            let segment = 1;
            while (
                segment < cumulative.length - 1 &&
                cumulative[segment] < targetDistance
            ) {
                segment += 1;
            }
            const segmentStart = cumulative[segment - 1];
            const segmentLength = cumulative[segment] - segmentStart;
            const segmentPhase = segmentLength > 0
                ? (targetDistance - segmentStart) / segmentLength
                : 0;
            const start = positions[segment - 1];
            const end = positions[segment];
            marker.setLatLng([
                start.lat + (end.lat - start.lat) * segmentPhase,
                start.lng + (end.lng - start.lng) * segmentPhase
            ]);
            if (options.rotateToPath) {
                const startPoint = map.latLngToLayerPoint(start);
                const endPoint = map.latLngToLayerPoint(end);
                const heading = Math.atan2(
                    endPoint.y - startPoint.y,
                    endPoint.x - startPoint.x
                ) * 180 / Math.PI + 90;
                const iconImage = marker.getElement()?.querySelector(
                    ".guide-cas-aircraft-icon"
                );
                if (iconImage) {
                    iconImage.style.transform = `rotate(${heading}deg)`;
                }
            }
            if (options.loop === false && elapsed >= 1) {
                if (options.onComplete) options.onComplete(marker);
                return;
            }
            requestGuideAnimationFrame(frame);
        }

        requestGuideAnimationFrame(frame);
    }

    function animateGuideConvoy(
        markers,
        positions,
        duration = 9000,
        options = {}
    ) {
        if (positions.length < 2 || !markers.length) return;
        const cumulative = [0];
        for (let index = 1; index < positions.length; index += 1) {
            const previous = positions[index - 1];
            const current = positions[index];
            cumulative.push(
                cumulative[index - 1] +
                Math.hypot(
                    current.lat - previous.lat,
                    current.lng - previous.lng
                )
            );
        }
        const totalDistance = cumulative[cumulative.length - 1];
        if (!(totalDistance > 0)) return;
        const spacing = totalDistance * 0.012;
        const startedAt = performance.now();

        function positionAt(distance) {
            const targetDistance = Math.max(
                0,
                Math.min(totalDistance, distance)
            );
            let segment = 1;
            while (
                segment < cumulative.length - 1 &&
                cumulative[segment] < targetDistance
            ) {
                segment += 1;
            }
            const segmentStart = cumulative[segment - 1];
            const segmentLength = cumulative[segment] - segmentStart;
            const segmentPhase = segmentLength > 0
                ? (targetDistance - segmentStart) / segmentLength
                : 0;
            const start = positions[segment - 1];
            const end = positions[segment];
            return [
                start.lat + (end.lat - start.lat) * segmentPhase,
                start.lng + (end.lng - start.lng) * segmentPhase
            ];
        }

        function frame(now) {
            const elapsed = (now - startedAt) / duration;
            const travelPhase = options.loop === false
                ? Math.min(1, elapsed)
                : elapsed % 1;
            const headDistance = totalDistance * (0.06 + travelPhase * 0.94);
            markers.forEach((marker, index) => {
                marker.setLatLng(positionAt(headDistance - spacing * index));
            });
            if (options.loop === false && elapsed >= 1) {
                if (options.onComplete) options.onComplete(markers);
                return;
            }
            requestGuideAnimationFrame(frame);
        }

        frame(startedAt);
    }

    function setGuideResource(marker, resource, value) {
        const normalized = Math.max(0, Math.min(600, value));
        const element = marker.getElement();
        const fill = element?.querySelector(
            `[data-guide-resource-fill="${resource}"]`
        );
        const text = element?.querySelector(
            `[data-guide-resource-value="${resource}"]`
        );
        if (fill) {
            fill.style.width = `${normalized / 6}%`;
        }
        if (text) {
            text.textContent = `${Math.round(normalized)} / 600`;
        }
    }

    function animateGuideResource(
        marker,
        resource,
        startValue,
        endValue,
        duration,
        onComplete = null
    ) {
        const startedAt = performance.now();
        setGuideResource(marker, resource, startValue);

        function frame(now) {
            const phase = Math.min(1, (now - startedAt) / duration);
            setGuideResource(
                marker,
                resource,
                startValue + (endValue - startValue) * phase
            );
            if (phase < 1) {
                requestGuideAnimationFrame(frame);
                return;
            }
            if (onComplete) onComplete();
        }

        requestGuideAnimationFrame(frame);
    }

        );

            position,
            ["fuel"],
            "Fuel depot"
        );
        let activeConvoys = 0;
        let dispatchReady = false;

        function tryDispatchConvoy() {
            if (!dispatchReady || activeConvoys >= 2) return;
            dispatchReady = false;
            activeConvoys += 1;
            setGuideResource(counter, "fuel", 0);
            const convoyMarkers = guideSupplyMarkers(
                1,
                position,
                29
            );
            animateGuideConvoy(
                convoyMarkers,
                positions,
                3250,
                {
                    loop: false,
                    onComplete: completedMarkers => {
                        completedMarkers.forEach(marker => {
                            if (guideMapGroup.hasLayer(marker)) {
                                guideMapGroup.removeLayer(marker);
                            }
                        });
                        activeConvoys -= 1;
                        tryDispatchConvoy();
                    }
                }
            );
            runProductionCycle(0);
        }

        function runProductionCycle(startValue = 0) {
            animateGuideResource(
                counter,
                "fuel",
                startValue,
                600,
                3150 * ((600 - startValue) / 600),
                () => {
                    dispatchReady = true;
                    tryDispatchConvoy();
                }
            );
        }
        setGuideResource(counter, "fuel", 300);
        runProductionCycle(300);
    }

    function guideCasUturnPath(start, target, turnRadius = 52) {
        const dx = target.lng - start.lng;
        const dy = target.lat - start.lat;
        const length = Math.hypot(dx, dy) || 1;
        const direction = { lat: dy / length, lng: dx / length };
        const perpendicular = {
            lat: -direction.lng,
            lng: direction.lat
        };
        const move = (point, along, across = 0) => L.latLng(
            point.lat +
                direction.lat * along +
                perpendicular.lat * across,
            point.lng +
                direction.lng * along +
                perpendicular.lng * across
        );
        const turnStart = move(target, 38);
        const center = move(turnStart, 0, turnRadius);
        const turn = [];
        for (let index = 1; index <= 20; index += 1) {
            const angle = Math.PI * index / 20;
            turn.push(L.latLng(
                center.lat +
                    direction.lat * Math.sin(angle) * turnRadius -
                    perpendicular.lat * Math.cos(angle) * turnRadius,
                center.lng +
                    direction.lng * Math.sin(angle) * turnRadius -
                    perpendicular.lng * Math.cos(angle) * turnRadius
            ));
        }
        return [
            start,
            move(target, -38),
            turnStart,
            ...turn,
            move(start, 0, turnRadius * 2)
        ];
    }

    function shiftGuidePath(path, rightMeters = 0, upMeters = 0) {
        const right = worldRadiusToMapRadius(rightMeters);
        const up = worldRadiusToMapRadius(upMeters);
        return path.map(point => L.latLng(
            point.lat + up,
            point.lng + right
        ));
    }

    function guideMobileFireLeg(from, to) {
        const route = globalRoadGraph
            ? findRoadPath(globalRoadGraph, from, to)
            : null;

            L.latLng(worldToLatLng(point[0], point[2]))
        );
    }

    function nearestGuideMobileTarget(
        unit,
        origin,
        excludedTargets = new Set()
    ) {
        return (globalMissionLogic?.mlrs_tbm_targets || [])
            .filter(target =>
                target.team !== unit.team &&
                !excludedTargets.has(target.name)
            )
            .map(target => ({
                target,
                distance: Math.hypot(
                    target.world_pos[0] - origin[0],
                    target.world_pos[2] - origin[2]
                )
            }))
            .sort((a, b) => a.distance - b.distance)[0]?.target;
    }

        if (target.category === "ammo_factory") return "ammo_storage";

        return "radar_station";

    function animateGuideRocket(
        start,
        end,
        duration = 2100,
        onComplete = null,
        options = {}
    ) {
        const trail = L.polyline([start, start], {
            color: "#ffcf70",
            weight: options.trailWeight || 3,
            opacity: 0.9,
            dashArray: "3, 7",
            interactive: false
        }).addTo(guideMapGroup);
        const rocket = L.marker(start, {
            pane: "guideSupportUnits",
            interactive: false,
            zIndexOffset: 3100,
            icon: guideMissileIcon(options.iconSize || 38)
        }).addTo(guideMapGroup);
        const startedAt = performance.now();
        let impacted = false;

        function frame(now) {
            const phase = Math.min(1, (now - startedAt) / duration);
            const eased = 1 - Math.pow(1 - phase, 2);
            const current = L.latLng(
                start.lat + (end.lat - start.lat) * eased,
                start.lng + (end.lng - start.lng) * eased
            );
            rocket.setLatLng(current);
            trail.setLatLngs([start, current]);

            const startPoint = map.latLngToLayerPoint(start);
            const endPoint = map.latLngToLayerPoint(end);
            // The supplied artwork points 45 degrees clockwise from north.
            const rotation = Math.atan2(
                endPoint.y - startPoint.y,
                endPoint.x - startPoint.x
            ) * 180 / Math.PI + 45;
            const rocketImage = rocket.getElement()?.querySelector(
                ".guide-rocket-icon"
            );
            if (rocketImage) {
                rocketImage.style.transform = `rotate(${rotation}deg)`;
            }

            if (phase < 1) {
                requestGuideAnimationFrame(frame);
                return;
            }
            if (!impacted) {
                impacted = true;
                if (options.onImpact) options.onImpact(end);
            }
            if (rocketImage) {
                rocketImage.style.transition = "opacity 650ms ease";
                rocketImage.style.opacity = "0";
            }
            const trailElement = trail.getElement();
            if (trailElement) {
                trailElement.style.transition = "opacity 650ms ease";
            }
            trail.setStyle({ opacity: 0 });
            scheduleGuideTimeout(() => {
                if (guideMapGroup.hasLayer(rocket)) {
                    guideMapGroup.removeLayer(rocket);
                }
                if (guideMapGroup.hasLayer(trail)) {
                    guideMapGroup.removeLayer(trail);
                }
                if (onComplete) onComplete();
            }, 700);
        }

        requestGuideAnimationFrame(frame);
    }

    function fireGuideMobileVolley(
        unit,
        start,
        end,
        onImpact,
        onComplete
    ) {
        const isMlrs = unit.unit_type === "mlrs";
        const shotCount = isMlrs ? 3 : 1;
        let completedShots = 0;

        for (let index = 0; index < shotCount; index += 1) {
            scheduleGuideTimeout(() => {
                const spread = index - (shotCount - 1) / 2;
                const target = L.latLng(
                    end.lat + spread * 5,
                    end.lng - spread * 3
                );
                animateGuideRocket(
                    start,
                    target,
                    isMlrs ? 1550 : 2150,
                    () => {
                        completedShots += 1;
                        if (
                            completedShots === shotCount &&
                            onComplete
                        ) {
                            onComplete();
                        }
                    },
                    {
                        iconSize: isMlrs ? 18 : 38,
                        trailWeight: isMlrs ? 1.5 : 3,
                        onImpact
                    }
                );
            }, index * 430);
        }
    }

    function runGuideMobileFireCycle(
        unit,
        marker,
        currentWorldPosition,
        areaIndex,
        color,
        sceneState,
        firingCycle = 0
    ) {
        const area = unit.move_areas[areaIndex];
        const positions = guideMobileFireLeg(
            currentWorldPosition,
            area.center
        );
        const destination = positions.at(-1);
        const movementLine = L.polyline(positions, {
            color,
            weight: 4,
            opacity: 0.88,
            dashArray: "8, 7",
            interactive: false
        }).addTo(guideMapGroup);
        let stateLabel = guideLabel(
            destination,
            `<b>${unit.unit_type.toUpperCase()} · CHANGING POSITION</b><br>` +
            `Relocation area ${areaIndex + 1}`,
            areaIndex % 2 ? "right" : "top"
        );

        animateGuideMarker(marker, positions, 3400, {
            loop: false,
            onComplete: () => {
                if (guideMapGroup.hasLayer(movementLine)) {
                    guideMapGroup.removeLayer(movementLine);
                }
                if (guideMapGroup.hasLayer(stateLabel)) {
                    guideMapGroup.removeLayer(stateLabel);
                }
                const firingPosition = marker.getLatLng();
                const rearmRing = L.circleMarker(firingPosition, {
                    radius: 23,
                    color: "#f6e05e",
                    fillColor: "#f6e05e",
                    fillOpacity: 0.08,
                    weight: 3,
                    dashArray: "4, 4",
                    interactive: false
                }).addTo(guideMapGroup);
                stateLabel = guideLabel(
                    firingPosition,
                    `<b>${unit.unit_type.toUpperCase()} · REARMING</b><br>` +
                    "60 seconds",
                    areaIndex % 2 ? "right" : "top"
                );

                scheduleGuideTimeout(() => {
                    if (guideMapGroup.hasLayer(rearmRing)) {
                        guideMapGroup.removeLayer(rearmRing);
                    }
                    if (guideMapGroup.hasLayer(stateLabel)) {
                        guideMapGroup.removeLayer(stateLabel);
                    }
                    const unavailableTargets = new Set([
                        ...sceneState.destroyedTargets,
                        ...sceneState.claimedTargets
                    ]);
                    const target = nearestGuideMobileTarget(
                        unit,
                        area.center,
                        unavailableTargets
                    );
                    if (!target) return;
                    sceneState.claimedTargets.add(target.name);
                    showGuideMobileTarget(target, sceneState);
                    const targetPosition = L.latLng(worldToLatLng(
                        target.world_pos[0],
                        target.world_pos[2]
                    ));
                    stateLabel = guideLabel(
                        firingPosition,
                        `<b>${unit.unit_type.toUpperCase()} · SHOOTING</b><br>` +
                        `Nearest eligible target: ${target.name}`,
                        areaIndex % 2 ? "right" : "top"
                    );
                    fireGuideMobileVolley(
                        unit,
                        firingPosition,
                        targetPosition,
                        impactPosition => {
                            guideExplosion(impactPosition);
                        },
                        () => {
                            destroyGuideMobileTarget(
                                target,
                                sceneState
                            );
                            if (guideMapGroup.hasLayer(stateLabel)) {
                                guideMapGroup.removeLayer(stateLabel);
                            }
                            stateLabel = guideLabel(
                                firingPosition,
                                `<b>${unit.unit_type.toUpperCase()} · EMPTY</b><br>` +
                                "Selecting a different relocation area",
                                areaIndex % 2 ? "right" : "top"
                            );
                            scheduleGuideTimeout(() => {
                                if (guideMapGroup.hasLayer(stateLabel)) {
                                    guideMapGroup.removeLayer(stateLabel);
                                }
                                if (firingCycle >= 1) {
                                    guideLabel(
                                        marker.getLatLng(),
                                        `<b>${unit.unit_type.toUpperCase()} · CYCLE COMPLETE</b><br>` +
                                        "It will continue relocating and retargeting",
                                        areaIndex % 2 ? "right" : "top"
                                    );
                                    return;
                                }
                                runGuideMobileFireCycle(
                                    unit,
                                    marker,
                                    area.center,
                                    (areaIndex + 1) %
                                        unit.move_areas.length,
                                    color,
                                    sceneState,
                                    firingCycle + 1
                                );
                            }, 650);
                        }
                    );
                }, 1500);
            }
        });
    }

                index % 2 ? "right" : "top"
            );
        });
    }

    function renderGuideScene(index) {
        clearGuideScene();
        guideTicketBoard.classList.toggle("attention", index === 2);
        if (index === 1) {
            showBattlefieldOverviewScene();
        } else if (index <= 2) {
            focusGuideTheatre();
        } else if (index === 3) {
            showFactoryScene();
        } else if (index === 4) {
            showRedSupplyScene();
        } else if (index === 5) {
            showRedColumnDispatchScene();
        } else if (index === 6) {
            showRedCasInterceptionScene();
        } else if (index === 7) {
            showFailedRedAttackScene();
        } else if (index === 8) {
            showBlueLogisticsScene();
        } else if (index === 9) {
            showBlueAssistedCaptureScene();
        } else if (index === 10) {
            showBlueAdvanceOverviewScene();
        } else if (index === 11) {
            showMobileFireScene();
        } else if (index === 12) {
            showEarlyWarningScene();
        } else if (index === 13) {
            showSamLayerScene();
        } else if (index === 14) {
            showFleetScene();
        } else if (index === 15) {
            showFirstEscalationScene();
        } else if (index === 16) {
            showFiveKtScene();
        } else if (index === 17) {
            showThirtyKtScene();
        } else if (index === 18) {
            showThirdEscalationScene();
        } else if (index === 19) {
            showFinalBriefingScene();
        }
    }

    function showGuideStep(index) {
        guideStepIndex = Math.max(0, Math.min(index, guideSteps.length - 1));
        const step = guideSteps[guideStepIndex];
        const tickets = step.tickets || { red: 10000, blue: 10000 };
        guideRedTickets.textContent = Number(tickets.red).toLocaleString();
        guideBlueTickets.textContent = Number(tickets.blue).toLocaleString();
        updateGuideEscalation();
        guideKicker.textContent = step.kicker;
        guideSpeaker.textContent = step.speaker;
        if (step.html) {
            guideText.innerHTML = step.html;
        } else {
            guideText.textContent = step.text;
        }
        guideProgress.textContent = `${guideStepIndex + 1} / ${guideSteps.length}`;
        guideBack.disabled = guideStepIndex === 0;
        guideNext.textContent = guideStepIndex === guideSteps.length - 1
            ? "End chapter"
            : "Next";
        renderGuideScene(guideStepIndex);
        if (guideStepIndex === 1) {
            bindGuideOverviewTerms();
        }
    }

    function startGuide() {
        clearSelectedRanges();
        map.closePopup();
        guideLayer.hidden = false;
        showGuideStep(0);
    }

    function closeGuide() {
        clearGuideScene();
        guideLayer.hidden = true;
    }

    document.getElementById("guide-start").addEventListener("click", startGuide);
    document.getElementById("guide-exit").addEventListener("click", closeGuide);
    map.on("click", restoreGuideOverviewRegions);
    guideBack.addEventListener("click", () => showGuideStep(guideStepIndex - 1));
    guideNext.addEventListener("click", () => {
        if (guideStepIndex === guideSteps.length - 1) {
            closeGuide();
            return;
        }
        showGuideStep(guideStepIndex + 1);
    });

    document.addEventListener("keydown", event => {
        if (guideLayer.hidden) return;
        if (event.key === "Escape") closeGuide();
        if (event.key === "ArrowLeft" && guideStepIndex > 0) {
            showGuideStep(guideStepIndex - 1);
        }
        if (event.key === "ArrowRight") {
            if (guideStepIndex === guideSteps.length - 1) closeGuide();
            else showGuideStep(guideStepIndex + 1);
        }
    });
</script>

</body>
</html>
